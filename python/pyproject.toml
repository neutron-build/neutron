[project]
name = "neutron-py"
version = "0.1.0"
description = "The AI application development framework for Python"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "starlette>=0.38.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "uvicorn[standard]>=0.30.0",
    "asyncpg>=0.29.0",
    "structlog>=24.0",
    "httpx>=0.27.0",
    "cyclopts>=3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27.0",
]
ai = [
    "httpx>=0.27.0",
]
crypto = [
    "PyJWT[crypto]>=2.8.0",
    "argon2-cffi>=23.1.0",
]
granian = [
    "granian>=2.0.0",
]
rich = [
    "rich>=13.0",
]
all = [
    "neutron[ai,crypto,granian,rich]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neutron"]
# N-009 note: hatchling's default editable mode writes a .pth containing the
# project root, so tests/ -- and any future sibling directory -- is importable
# in the consuming application and shadows its own module of that name.
# dev-mode-exact = true fixes that, but it emits an `editables` redirector that
# the consuming venv must have installed, and without it neutron stops
# importing altogether. That is a worse failure than the shadowing, so the fix
# needs either `editables` declared as a runtime dependency or tests/ moved out
# of the project root. Left as-is deliberately rather than half-applied.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# Optional / stub-less third-party dependencies.
[[tool.mypy.overrides]]
module = [
    "asyncpg",
    "asyncpg.*",
    "bcrypt",
    "granian",
    "granian.*",
]
ignore_missing_imports = true
