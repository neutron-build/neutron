[project]
name = "neutron-py"
version = "0.1.0"
description = "The AI application development framework for Python"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "starlette>=0.38.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "uvicorn[standard]>=0.30.0",
    "asyncpg>=0.29.0",
    "structlog>=24.0",
    "httpx>=0.27.0",
    "cyclopts>=3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27.0",
    # The password-hashing tests need a hasher. Without this, `pip install -e
    # ".[test]"` — what CI and CONTRIBUTING both run — leaves 10 tests failing
    # on ImportError, which is how they went red in CI for over a week.
    # NOT `neutron[crypto]` — this distribution is named `neutron-py`, and
    # `neutron` on PyPI is OpenStack's networking service.
    "neutron-py[crypto]",
]
ai = [
    "httpx>=0.27.0",
]
crypto = [
    "PyJWT[crypto]>=2.8.0",
    "argon2-cffi>=23.1.0",
]
granian = [
    "granian>=2.0.0",
]
rich = [
    "rich>=13.0",
]
all = [
    "neutron-py[ai,crypto,granian,rich]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neutron"]
# A-009. Hatchling's DEFAULT editable mode writes a .pth containing the project
# ROOT, so `tests/` -- and any future sibling of `neutron/` -- becomes importable
# in the consuming application and can shadow its own module of that name.
# Confirmed: from a venv with `pip install -e <this>`, `import tests` resolved to
# Neutron's own tests package.
#
# dev-mode-exact writes an `import _editable_impl_neutron_py` shim instead, which
# maps the package exactly and exposes nothing else. This was previously deferred
# on the belief that the shim requires `editables` in the consuming venv and that
# neutron would stop importing without it. Measured: hatchling declares
# `editables` as a dependency OF THE EDITABLE INSTALL, so pip pulls it in
# automatically (editables 0.6 appeared unprompted). Verified in a clean venv --
# `neutron` imports, `import tests` raises ModuleNotFoundError.
#
# The one case that would still bite is an editable install done with --no-deps,
# where the shim's dependency is skipped.
dev-mode-exact = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# Optional / stub-less third-party dependencies.
[[tool.mypy.overrides]]
module = [
    "asyncpg",
    "asyncpg.*",
    "bcrypt",
    "granian",
    "granian.*",
]
ignore_missing_imports = true
