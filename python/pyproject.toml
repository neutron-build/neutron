[project]
name = "neutron-framework"
version = "0.1.0"
description = "The AI application development framework for Python"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "starlette>=0.38.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "uvicorn[standard]>=0.30.0",
    "asyncpg>=0.29.0",
    "structlog>=24.0",
    "httpx>=0.27.0",
    "cyclopts>=3.0",
]

[project.urls]
Homepage = "https://neutron.build/"
Documentation = "https://neutron.build/docs/python/overview"
Repository = "https://github.com/neutron-build/neutron"
Issues = "https://github.com/neutron-build/neutron/issues"

[project.optional-dependencies]
orm = [
    "psycopg[binary]>=3.2,<4",
]
test = [
    "editables>=0.5",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27.0",
    # The password-hashing tests need a hasher. Without this, `pip install -e
    # ".[test]"` — what CI and CONTRIBUTING both run — leaves 10 tests failing
    # on ImportError, which is how they went red in CI for over a week.
    # NOT `neutron[crypto]` — this distribution is named `neutron-framework`, and
    # `neutron` on PyPI is OpenStack's networking service.
    "neutron-framework[crypto]",
]
ai = [
    "httpx>=0.27.0",
]
crypto = [
    "PyJWT[crypto]>=2.8.0",
    "argon2-cffi>=23.1.0",
]
granian = [
    "granian>=2.0.0",
]
rich = [
    "rich>=13.0",
]
all = [
    "neutron-framework[ai,crypto,granian,rich]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neutron"]
# A-009. Hatchling's DEFAULT editable mode writes a .pth containing the project
# ROOT, so `tests/` -- and any future sibling of `neutron/` -- becomes importable
# in the consuming application and can shadow its own module of that name.
# Confirmed: from a venv with `pip install -e <this>`, `import tests` resolved to
# Neutron's own tests package.
#
# dev-mode-exact maps the package exactly, exposing nothing else. The shim
# requires `editables`; the test extra declares it explicitly because a clean
# uv editable install did not install it from hatchling's editable metadata.
dev-mode-exact = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# Optional / stub-less third-party dependencies.
[[tool.mypy.overrides]]
module = [
    "asyncpg",
    "asyncpg.*",
    "bcrypt",
    "granian",
    "granian.*",
]
ignore_missing_imports = true
