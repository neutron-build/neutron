[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "2.0.0-dev"
edition = "2021"
license = "BUSL-1.1"
rust-version = "1.85"

[workspace.dependencies]
nucleus-kv = { path = "crates/nucleus-kv" }
nucleus-txn = { path = "crates/nucleus-txn" }
thiserror = "1"
# Maintained fork of im. 7.0 for RUSTSEC-2026-0292 (sized-chunks); needs Rust 1.85.
imbl = { version = "7.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"

# G0 model checking explores millions of states; optimise it even in test builds.
[profile.dev.package.nucleus-g0]
opt-level = 3
