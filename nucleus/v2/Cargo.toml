[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "2.0.0-dev"
edition = "2021"
license = "BUSL-1.1"
rust-version = "1.80"

[workspace.dependencies]
nucleus-kv = { path = "crates/nucleus-kv" }
nucleus-txn = { path = "crates/nucleus-txn" }
thiserror = "1"
# Maintained fork of im (no sized-chunks advisories). ~6.0: 6.1+ needs Rust 1.85.
imbl = { version = "~6.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
