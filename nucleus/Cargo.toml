[package]
name = "nucleus"
version = "0.1.6"
edition = "2024"
autobins = false
description = "The definitive database engine"
license = "BSL-1.1"
authors = ["Tyler"]
repository = "https://github.com/neutron-build/neutron"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
async-trait = "0.1"
bytes = "1"
crc32c = "0.6"
dashmap = "6"
futures = "0.3"
parking_lot = "0.12"
pgwire = { version = "0.36", features = ["server-api-aws-lc-rs", "pg-type-rust-decimal"], optional = true }
rcgen = { version = "0.13", optional = true }
rustls-pemfile = { version = "2", optional = true }
rand = "0.8"
rayon = { version = "1.10", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlparser = { version = "0.61", features = ["visitor"] }
thiserror = "2"
# `time` is needed by the graceful-shutdown drain, which is not server-specific;
# the `server` feature pulls `tokio/full` anyway, so this only affects core-only.
tokio = { version = "1", features = ["sync", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
clap = { version = "4.5.58", features = ["derive"], optional = true }
base64 = "0.22.1"
blake3 = "1"
md5 = "0.8"
sha2 = { version = "0.10", optional = true }
hmac = { version = "0.12", optional = true }
toml = "0.8"
core_affinity = { version = "0.8", optional = true }
rustyline = { version = "14", optional = true }
lz4_flex = "0.11"
zstd = { version = "0.13", optional = true }
regex = "1.12.3"
rust_decimal = "1.40"
chrono = "0.4"
chrono-tz = "0.10"
# `with-serde_json-1` is for the test suite: it is what lets a test bind and
# read a JSONB value in BINARY format, which is the format every mainstream
# driver uses and the one whose version header was mishandled in both
# directions. Without it no Rust test can reach that path at all.
tokio-postgres = { version = "0.7", optional = true, features = ["with-serde_json-1"] }
comfy-table = { version = "7", optional = true }
redis = { version = "0.27", features = ["tokio-comp"], optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }
urlencoding = { version = "2", optional = true }
rusqlite = { version = "0.30", features = ["bundled"], optional = true }
mongodb = { version = "3.8", optional = true }
mysql_async = { version = "0.36", optional = true }
clickhouse = { version = "0.11", optional = true }
opentelemetry = { version = "0.29", optional = true }
opentelemetry_sdk = { version = "0.29", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.29", features = ["grpc-tonic"], optional = true }
tracing-opentelemetry = { version = "0.30", optional = true }
ort = { version = "2.0.0-rc.11", features = ["ndarray"], optional = true }
ndarray = { version = "0.17", optional = true }
# --- Allocators (mutually exclusive at runtime via feature selection) ---
#   `mimalloc-allocator` (default in `server`) — universal, builds clean on
#       macOS / Linux / Windows; perf within ~5–10% of jemalloc.
#   `jemalloc` — opt-in for Linux production tuning where allocator-specific
#       behavior matters; do not enable on macOS ARM64 (jemalloc-sys build
#       fails against Darwin toolchain).
mimalloc = { version = "0.1", optional = true, default-features = false }
tikv-jemallocator = { version = "0.6", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
getrandom = { version = "0.2", optional = true }

# Free-space probing for the disk watermark guard (`src/ops/disk.rs`) needs
# `statvfs`; on non-Unix targets the probe reports Unsupported instead.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["server"]
server = [
    "dep:pgwire", "dep:rayon", "dep:core_affinity", "dep:rustyline",
    "dep:clap", "dep:rcgen", "dep:rustls-pemfile", "dep:tokio-postgres",
    "dep:tracing-subscriber", "dep:zstd", "dep:sha2", "dep:hmac", "mimalloc-allocator",
    "tokio/full", "tokio/rt-multi-thread",
]
wasm = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:serde-wasm-bindgen", "getrandom/js"]
bench-tools = ["server", "comfy-table", "dep:redis", "dep:reqwest", "rusqlite", "mongodb", "dep:mysql_async", "clickhouse"]
rusqlite = ["dep:rusqlite"]
mongodb = ["dep:mongodb"]
clickhouse = ["dep:clickhouse", "dep:urlencoding", "dep:reqwest"]
otel = ["server", "opentelemetry", "opentelemetry_sdk", "opentelemetry-otlp", "tracing-opentelemetry"]
onnx = ["ort", "ndarray"]

# --- Allocator features (pick exactly one if you want a custom allocator) ---
mimalloc-allocator = ["dep:mimalloc"]
jemalloc           = ["dep:tikv-jemallocator"]

# --- Diagnostic features (off by default; opt-in for debugging) ---
# When enabled, the executor logs a per-statement RSS delta on Linux for any
# statement that grows RSS by >1 MB. Heavyweight (reads /proc/self/statm
# twice per statement); leave off in steady-state production.
memory-debug = []

[dev-dependencies]
tempfile = "3"
# `test-util` gives tests virtual time (`start_paused`), so a monitor-loop test
# asserts on ticks rather than on real sleeps. Dev-only: it is not compiled
# into the server.
tokio = { version = "1", features = ["test-util", "rt", "rt-multi-thread", "macros", "time"] }
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
proptest = "1"
libc = "0.2"

[[bin]]
name = "nucleus"
path = "src/main.rs"
required-features = ["server"]

[[bin]]
name = "pg_compare"
path = "src/bin/pg_compare.rs"
required-features = ["server"]

[[bin]]
name = "repro_txn_delete"
path = "src/bin/repro_txn_delete.rs"
required-features = ["server"]

[[bin]]
name = "attr_pk_write"
path = "src/bin/attr_pk_write.rs"
required-features = ["server"]

[[bin]]
name = "attr_join"
path = "src/bin/attr_join.rs"
required-features = ["server"]

[[bin]]
name = "attr_delete"
path = "src/bin/attr_delete.rs"
required-features = ["server"]

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"
required-features = ["bench-tools"]

[[bin]]
name = "compete"
path = "src/bin/compete.rs"
required-features = ["bench-tools"]

[[bin]]
name = "compete_vector"
path = "src/bin/compete_vector.rs"
required-features = ["bench-tools"]

[[bin]]
name = "stress"
path = "src/bin/stress.rs"
required-features = ["server"]

[[bin]]
name = "fuzz"
path = "src/bin/fuzz.rs"
required-features = ["server", "rusqlite"]

# Extended SQL differential fuzzer (also vs SQLite) — needs rusqlite, so it must
# be gated like `fuzz` or a plain `cargo build` fails to resolve the dep.
[[bin]]
name = "probe_sqlext"
path = "src/bin/probe_sqlext.rs"
required-features = ["server", "rusqlite"]

# Tier 1/2 probe harnesses that link rusqlite (SQLite oracle / shared helpers) —
# gated like the others so a plain `cargo build`/`cargo test --features server`
# (no rusqlite) skips them rather than failing to resolve the dep.
