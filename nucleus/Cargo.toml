# Correctness-paired benchmark harness (vector recall / FTS set-equality /
# graph BFS+Dijkstra) — every latency number ships with a correctness number
# measured on the same run against an inline reference. No external DB needed.
[[bin]]
name = "bench_paired"
path = "src/bin/bench_paired.rs"
required-features = ["server"]

[[bench]]
