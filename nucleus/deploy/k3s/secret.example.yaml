# Example only — do NOT commit a filled-in copy of this file.
#
# The password below is a placeholder. Replace it, or create the secret
# imperatively so the value never touches the filesystem:
#
#   kubectl create secret generic nucleus \
#     --from-literal=password="$(head -c 32 /dev/urandom | base64)"
#
# A Kubernetes Secret is base64, not encryption: anyone with `get secrets` in
# the namespace can read it. For anything beyond a lab, back it with an
# external store (sealed-secrets, external-secrets, Vault).
apiVersion: v1
kind: Secret
metadata:
  name: nucleus
type: Opaque
stringData:
  password: CHANGE-ME
