# Nucleus on k3s — single instance.
#
# STATUS: WRITTEN, NOT YET APPLIED. Schema-checked (kubeconform, 1.31.0); two
# attempts to run k3s inside the development host's container VM failed on
# environment limits (cpuset cgroups v2, then /dev/kmsg) rather than on these
# manifests — see `nucleus/deploy/README.md`.
#
# k3s rather than managed Kubernetes: it installs in one command on a Proxmox
# VM, ships a working default StorageClass (`local-path`), and — unlike
# kind/k3d-in-Docker — exercises real PersistentVolume semantics, which is the
# only part of this that a database actually cares about.
#
# ONE replica, deliberately. Nucleus's distributed mode (Raft) is incomplete
# and unsupported: Raft hard state is never persisted, and replication ships
# raw SQL strings, so `now()`/`random()`/`nextval()` diverge across replicas.
# Scaling this StatefulSet up would produce a cluster that silently disagrees
# with itself. Do not raise `replicas` until Milestone 9 closes.
#
#   kubectl apply -f secret.example.yaml   # after editing it
#   kubectl apply -f nucleus.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: nucleus
  labels:
    app.kubernetes.io/name: nucleus
spec:
  # Headless: gives each pod a stable DNS name
  # (nucleus-0.nucleus.<ns>.svc.cluster.local), which is what a StatefulSet
  # needs and what a future multi-node cluster would discover peers through.
  clusterIP: None
  selector:
    app.kubernetes.io/name: nucleus
  ports:
    - name: pgwire
      port: 5432
      targetPort: pgwire
      protocol: TCP
    - name: resp
      port: 6379
      targetPort: resp
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: nucleus-client
  labels:
    app.kubernetes.io/name: nucleus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nucleus
  ports:
    - name: pgwire
      port: 5432
      targetPort: pgwire
      protocol: TCP
    - name: resp
      port: 6379
      targetPort: resp
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nucleus
spec:
  # With one replica this blocks every VOLUNTARY eviction — `kubectl drain`
  # will hang rather than take the only database instance down silently. That
  # is the intended behaviour for a single-instance database: draining the
  # node must be a decision, not a side effect. Use `--disable-eviction` or
  # delete the PDB when you genuinely mean to take the outage.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nucleus
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nucleus
  labels:
    app.kubernetes.io/name: nucleus
spec:
  serviceName: nucleus
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nucleus
  # A database must not have two pods holding the same PersistentVolume, even
  # briefly. OnDelete/Recreate semantics: the old pod is fully terminated
  # before the new one starts.
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nucleus
    spec:
      securityContext:
        # Matches the uid/gid baked into the image (see nucleus/Dockerfile).
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        # Makes the PersistentVolume group-writable by the container user;
        # without it the pod cannot create its data directory.
        fsGroup: 10001
      # The drain is 2 s and the flush that follows is unbounded and scales
      # with buffer-pool size. Kubernetes SIGKILLs at the end of this period;
      # if that lands mid-flush the database still recovers from the WAL, but
      # startup afterwards is slower.
      terminationGracePeriodSeconds: 120
      containers:
        - name: nucleus
          image: ghcr.io/neutron-build/nucleus:latest
          imagePullPolicy: IfNotPresent
          args:
            - start
            - --host
            - 0.0.0.0
            - --port
            - "5432"
            - --data
            - /data
          ports:
            - name: pgwire
              containerPort: 5432
            - name: resp
              containerPort: 6379
          env:
            - name: NUCLEUS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nucleus
                  key: password
          # LIVENESS/READINESS ARE TCP ONLY, and that is a real limitation:
          # a TCP accept proves the listener is up, not that the engine can
          # serve a query. A true readiness probe needs to authenticate and
          # run `SELECT 1`; there is no credential-free health endpoint to
          # probe. Treat "Ready" here as "accepting connections".
          startupProbe:
            tcpSocket:
              port: pgwire
            # Recovery replays the WAL before the listener binds; a large WAL
            # can take minutes. 60 x 5 s = 5 minutes before k8s gives up.
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: pgwire
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: pgwire
            periodSeconds: 30
            timeoutSeconds: 5
            # Deliberately tolerant. A liveness probe that restarts a database
            # under load is a self-inflicted outage; 5 x 30 s means a full
            # 2.5 minutes of unresponsiveness before a restart.
            failureThreshold: 5
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              # No CPU limit on purpose: throttling a database at a quota
              # boundary produces latency cliffs that look like engine bugs.
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # k3s default. Note that `local-path` pins the volume to one node, so
        # the pod cannot reschedule elsewhere — correct for a single-node
        # lab, wrong for a multi-node cluster where you want Longhorn or an
        # equivalent.
        storageClassName: local-path
        resources:
          requests:
            storage: 20Gi
