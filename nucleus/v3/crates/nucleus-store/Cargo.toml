[package]
name = "nucleus-store"
description = "Page file, buffer manager, B+tree, WAL, checkpoint and recovery (PLAN-v3 §3.3); specified by S-1"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# Provenance (card A-0): [features], [dependencies] and [dev-dependencies] are
# nucleus/v3/spikes/e0-btree/Cargo.toml at 7ccd1cff8ef926f95a240b15d4b9c6a346251efe
# lines 16-25, 28 and 31-45, with this crate's name in place of e0-btree. The
# spike's benchmark feature and its SQLite dependency (lines 14-15, 29) are not
# copied: the benchmark stays with the spike.

[features]
# Non-default (card X-0-F1-F1): exposes the test-only chaos hook
# `insert_early_release`, which exists solely so this crate's own tests can
# pin T-COUPLING (X-0-F1 verdict, finding 1). Reach (X-0-F1-F1 verdict,
# finding 1): the feature never reaches crates outside this workspace, nor
# any normal (non-test) build — but `cargo test --workspace` unifies it,
# via the self dev-dependency below, into the nucleus-store copy that other
# workspace crates' tests link, so a workspace crate's tests could call the
# hook. No workspace crate other than nucleus-store may reference
# `insert_early_release`.
test-hooks = []

[dependencies]
thiserror = { workspace = true }

[dev-dependencies]
proptest = "1.12"
# Self dev-dependency (card X-0-F1-F1): cargo unifies its features into the
# lib copy the integration tests link, so `tests/model.rs` sees
# `insert_early_release` under the plain featureless `cargo test` the gate
# runs — this is what keeps the T-COUPLING pin in that featureless run. A
# dev-dependency only, so it never reaches crates outside this workspace,
# nor any normal (non-test) build. It does reach workspace test builds:
# under `cargo test --workspace` the same unification gives other workspace
# crates' tests a nucleus-store copy that has the feature, so their tests could
# call the hook — no workspace crate other than nucleus-store may reference
# `insert_early_release`. `required-features` on `[[test]] model` was
# rejected because it would drop the whole model suite from the gate's
# featureless run.
nucleus-store = { path = ".", features = ["test-hooks"] }

[lints]
workspace = true
