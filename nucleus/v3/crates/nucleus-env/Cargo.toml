[package]
name = "nucleus-env"
description = "I/O, clock and randomness abstraction (PLAN-v3 §3.2): the Env trait, StdEnv, MemEnv; SimEnv lands in A-1b"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
thiserror = { workspace = true }

[features]
# SimEnv (card A-1b): the deterministic simulator. Off by default, so the
# wasm32 build and every production build compile no simulator code.
sim = []

[dev-dependencies]
nucleus-env = { path = ".", features = ["sim"] }

[lints]
workspace = true
