# Minimal Dovecot 2.3 config for the live IMAP oracle. Plaintext auth over
# plain IMAP is deliberate: the container is published on loopback only and
# the test dialer (imap.Config.Plaintext) refuses non-loopback hosts anyway.
protocols = imap lmtp
listen = *
disable_plaintext_auth = no
ssl = no
auth_mechanisms = plain login
log_path = /dev/stderr
mail_location = maildir:~/Maildir
mail_uid = vmailer
mail_gid = vmailer
first_valid_uid = 5000
default_internal_user = vmailer

passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /etc/dovecot/users
}

userdb {
  driver = static
  args = uid=vmailer gid=vmailer home=/var/mail/vhome/%u
}

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}

service lmtp {
  inet_listener lmtp {
    address = 127.0.0.1
    port = 24
  }
}

service imap-login {
  inet_listener imap {
    port = 143
  }
}
