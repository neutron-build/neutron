name: SDK vs live Nucleus

# The gate that did not exist, and whose absence is the single biggest source
# of "this SDK method has never worked" findings in this repo.
#
# On 2026-08-11 a manual sweep found that Document.get, Graph.neighbors,
# Graph.shortest_path, CDC.read, TimeSeries.range_count/range_avg,
# Streams.xrange/xread, Blob.get/meta, Datalog.query and the KV range reads had
# NEVER worked over pgwire from Python -- while every one of them had a green
# test, because `test_nucleus_models.py` says in its own first line that it is
# "mocked -- no real DB required". A mock proves the client builds the SQL the
# test expects. It cannot know the server describes that statement with zero
# result columns, or types a parameter as TEXT that the client binds as an int.
#
# The engine's own testing is not the gap: 4,248 unit tests, a differential
# fuzzer at zero divergences against SQLite, 49 probes. Every one of those bugs
# lived at the client boundary, where nothing looked.
#
# The cases now live in conformance/live/spec.json and every SDK runs the SAME
# ones through a thin executor, so six ports cannot drift from each other. The
# `drift` job is the part a per-SDK suite can never provide: it compares the
# recorded status of every case across every SDK and fails on disagreement.

on:
  push:
    branches: [main]
    paths:
      - "nucleus/**"
      - "conformance/live/**"
      - "python/**"
      - "go/**"
      - "typescript/packages/neutron-nucleus/**"
      - "rust/crates/neutron-nucleus/**"
      - "elixir/**"
      - "zig/**"
      - "julia/**"
      - ".github/workflows/sdk-live.yml"
  pull_request:
    paths:
      - "nucleus/**"
      - "conformance/live/**"
      - "python/**"
      - "go/**"
      - "typescript/packages/neutron-nucleus/**"
      - "rust/crates/neutron-nucleus/**"
      - "elixir/**"
      - "zig/**"
      - "julia/**"
      - ".github/workflows/sdk-live.yml"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # One engine build, reused by every SDK leg.
  engine:
    name: Build the engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nucleus
      - name: Build nucleus
        working-directory: nucleus
        run: cargo build --release --bin nucleus --features server
      - uses: actions/upload-artifact@v4
        with:
          name: nucleus-bin
          path: nucleus/target/release/nucleus
          if-no-files-found: error
          retention-days: 1

  sdk:
    name: ${{ matrix.sdk }} vs live Nucleus
    needs: engine
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [python, go, typescript]
        # S15/S17-S19 add rust, elixir, zig and julia here as their executors
        # land. An SDK absent from this list is UNPROVEN, and the drift job
        # below says so out loud rather than counting it as agreement.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nucleus-bin
          path: nucleus/target/release
      - run: chmod +x nucleus/target/release/nucleus

      - uses: actions/setup-python@v5
        if: matrix.sdk == 'python'
        with:
          python-version: "3.11"

      - name: Install the Python SDK
        if: matrix.sdk == 'python'
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          # `.[test]`, matching python.yml and CONTRIBUTING. There is no [dev]
          # extra; pip ignores an unknown one silently, so the install
          # "succeeded" and then pytest was not found.
          pip install -e ".[test]"
          python -c "import pytest, asyncpg; print('extras OK')"

      - uses: actions/setup-go@v5
        if: matrix.sdk == 'go'
        with:
          go-version: "1.25"
          cache-dependency-path: conformance/live/executors/go/go.sum

      - uses: pnpm/action-setup@v4
        if: matrix.sdk == 'typescript'
        with:
          package_json_file: typescript/package.json
      - uses: actions/setup-node@v4
        if: matrix.sdk == 'typescript'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      # The executor imports the built package by path and fails loudly if it
      # is missing, rather than resolving some other copy.
      - name: Build the TypeScript Nucleus client
        if: matrix.sdk == 'typescript'
        working-directory: typescript
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @neutron-build/nucleus build

      - name: Start Nucleus
        run: sh conformance/live/scripts/start-engine.sh 55432 /tmp/nucleus-live

      - name: Run the live spec
        env:
          NEUTRON_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55432/postgres
        run: node conformance/live/runner/run.mjs ${{ matrix.sdk }}

      - name: Report
        if: always()
        run: tail -50 /tmp/nucleus-live/server.log || true

  drift:
    name: Cross-SDK behavioural diff
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nucleus-bin
          path: nucleus/target/release
      - run: chmod +x nucleus/target/release/nucleus

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Start Nucleus
        run: sh conformance/live/scripts/start-engine.sh 55432 /tmp/nucleus-live

      # Runs every executor that exists and fails if two of them disagree about
      # the same case. With one executor this proves nothing yet and says so;
      # it becomes the anti-drift oracle the moment the second one lands.
      - name: Every available executor, diffed
        env:
          NEUTRON_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55432/postgres
        run: node conformance/live/runner/run.mjs
