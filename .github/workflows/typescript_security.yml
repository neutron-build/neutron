name: TypeScript Security

on:
  push:
    branches: [main]
    paths:
      - "typescript/**"
      - ".github/workflows/typescript_security.yml"
  pull_request:
    paths:
      - "typescript/**"
      - ".github/workflows/typescript_security.yml"
  schedule:
    # Weekly, so newly-disclosed advisories surface even without a push.
    - cron: "0 6 * * 1"

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # `version: latest` resolved to pnpm 12, whose store layout breaks
      # setup-node@v4's cache save (post-step "Path Validation Error").
      # Read the version from typescript/package.json — one source of truth,
      # same as typescript.yml.
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: typescript/package.json

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: typescript

      # Gating: any high or critical advisory fails the job.
      - name: pnpm audit (high+)
        run: pnpm audit --audit-level=high
        working-directory: typescript

  semgrep:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Rulesets target the exact bug classes hardened in this codebase:
      # XSS sinks (dangerouslySetInnerHTML), regex sanitizers, ReDoS, weak
      # crypto/compares, and the OWASP Top 10.
      - name: Semgrep scan
        run: |
          semgrep --error \
            --config p/typescript \
            --config p/react \
            --config p/owasp-top-ten \
            --config p/secrets \
            --metrics off \
            typescript/
        continue-on-error: true
