# Promoted from typescript/.github/workflows/benchmarks.yml, which GitHub never
# read — workflows only run from the repository root. The smoke job carries a
# regression gate (`compare:gate:smoke`) that has therefore never gated
# anything.
#
# Numbers produced here are NOT publishable. Shared CI runners are noisy
# neighbours and the absolute figures move run to run; this exists to catch a
# regression in Neutron against itself, not to source a marketing claim. Every
# published figure has to trace to _internal/GROUND_TRUTH.md with its
# methodology attached.
name: TypeScript Benchmarks

on:
  push:
    branches: [main]
    paths:
      - "typescript/packages/**"
      - "typescript/apps/**"
      - "typescript/benchmarks/**"
      - "typescript/pnpm-lock.yaml"
      - "typescript/pnpm-workspace.yaml"
      - "typescript/turbo.json"
      - ".github/workflows/typescript-benchmarks.yml"
  pull_request:
    paths:
      - "typescript/packages/**"
      - "typescript/apps/**"
      - "typescript/benchmarks/**"
      - "typescript/pnpm-lock.yaml"
      - "typescript/pnpm-workspace.yaml"
      - "typescript/turbo.json"
      - ".github/workflows/typescript-benchmarks.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: "Benchmark profile to run"
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full

concurrency:
  group: ts-benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke Benchmark
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.profile == 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: typescript/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            typescript/pnpm-lock.yaml
            typescript/benchmarks/pnpm-lock.yaml
            typescript/benchmarks/next-app/pnpm-lock.yaml
            typescript/benchmarks/remix-app/pnpm-lock.yaml
            typescript/benchmarks/remix3-fw/pnpm-lock.yaml
            typescript/benchmarks/astro-app/pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # --ignore-workspace is load-bearing. benchmarks/ is not a workspace
      # member, so from the workspace root pnpm resolved the install back to
      # the root, exited 0, and installed nothing — the harness then died on
      # `Cannot find package 'autocannon'`. The harness's own installSteps
      # already pass this flag for every subject app; the workflow did not.
      - name: Install benchmark harness dependencies
        run: pnpm --dir benchmarks install --frozen-lockfile --ignore-workspace

      - name: Assert the harness actually installed
        run: node -e "import('autocannon').then(()=>console.log('harness deps OK'))"
        working-directory: typescript/benchmarks

      # The harness builds apps/playground as the Neutron subject, and the
      # playground resolves the framework through the workspace packages' dist/
      # entry points. Without this the run dies on
      # `Command failed (1): pnpm --filter @neutron/playground build`.
      - name: Build the workspace
        run: pnpm -r build

      - name: Run smoke benchmark
        run: pnpm --dir benchmarks run compare:quick

      # ARMED 2026-08-17. The baseline is `results/ci-smoke-baseline.json` — the
      # per-row median of 8 consecutive CI runs on this runner class, not a
      # single sample of one — and the thresholds in `bench-gate-thresholds.json`
      # come from measuring what the runner does to an unchanged request path.
      # Re-derive both with `node scripts/measure-gate-noise.mjs`.
      #
      # What that measurement found, and it decided the design: GitHub's shared
      # pool has at least two performance classes. Five of the eight runs landed
      # within 1.4% of the median and three landed 39-43% below it, on commits
      # that never touched the request path. So the I/O-bound scenarios cannot
      # see anything under ~2x here, and `compute` — CPU-bound, 99-109% across
      # every run including the slow ones — is the only one that can gate
      # tightly. It does, at 25%; everything else gates at 60%. Validated by
      # replaying all 8 historical runs through the armed gate: 0 false
      # positives. A deliberate 10x regression fails it, and so does a 30% drop
      # on `compute`.
      #
      # Exit 1 is a real regression and fails the job. Exit 2 still means the
      # gate could not compare — a baseline recorded under a different profile —
      # and is reported loudly without failing, because a red light for "the
      # baseline is incomparable" is indistinguishable from a red light for "the
      # code got slower", and the second one is the one that has to be believed.
      - name: Enforce smoke regression gate
        run: |
          set +e
          pnpm --dir benchmarks run compare:gate:smoke
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "::warning::benchmark gate could not compare — baseline profile does not match this run"
            exit 0
          fi
          exit "$code"

      - name: Upload smoke results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke-${{ github.run_id }}
          path: |
            typescript/benchmarks/results/latest.json
            typescript/benchmarks/results/run-*.json
          if-no-files-found: error
          retention-days: 14

  full:
    name: Full Benchmark
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: typescript/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            typescript/pnpm-lock.yaml
            typescript/benchmarks/pnpm-lock.yaml
            typescript/benchmarks/next-app/pnpm-lock.yaml
            typescript/benchmarks/remix-app/pnpm-lock.yaml
            typescript/benchmarks/remix3-fw/pnpm-lock.yaml
            typescript/benchmarks/astro-app/pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # --ignore-workspace is load-bearing. benchmarks/ is not a workspace
      # member, so from the workspace root pnpm resolved the install back to
      # the root, exited 0, and installed nothing — the harness then died on
      # `Cannot find package 'autocannon'`. The harness's own installSteps
      # already pass this flag for every subject app; the workflow did not.
      - name: Install benchmark harness dependencies
        run: pnpm --dir benchmarks install --frozen-lockfile --ignore-workspace

      - name: Assert the harness actually installed
        run: node -e "import('autocannon').then(()=>console.log('harness deps OK'))"
        working-directory: typescript/benchmarks

      # The harness builds apps/playground as the Neutron subject, and the
      # playground resolves the framework through the workspace packages' dist/
      # entry points. Without this the run dies on
      # `Command failed (1): pnpm --filter @neutron/playground build`.
      - name: Build the workspace
        run: pnpm -r build

      - name: Run full benchmark
        run: pnpm --dir benchmarks run compare:full

      - name: Upload full results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-full-${{ github.run_id }}
          path: |
            typescript/benchmarks/results/latest.json
            typescript/benchmarks/results/run-*.json
          if-no-files-found: error
          retention-days: 30
