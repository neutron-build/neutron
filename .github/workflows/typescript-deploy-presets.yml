# Promoted from typescript/.github/workflows/deploy-presets.yml, which GitHub
# never read — workflows only run from the repository root. It had been sitting
# there valid and unexecuted, which is why no generated deploy preset has ever
# been validated by CI despite a job existing to do it.
# 2026-08: presets are now also booted — docker as a real process, vercel's
# generated handler invoked in-process, cloudflare static-only. See
# typescript/scripts/deploy-preset-boot-smoke.mjs.
name: TypeScript Deploy Presets

on:
  push:
    branches: [main]
    paths:
      - "typescript/packages/**"
      - "typescript/apps/**"
      - "typescript/pnpm-lock.yaml"
      - "typescript/pnpm-workspace.yaml"
      - "typescript/turbo.json"
      - ".github/workflows/typescript-deploy-presets.yml"
  pull_request:
    paths:
      - "typescript/packages/**"
      - "typescript/apps/**"
      - "typescript/pnpm-lock.yaml"
      - "typescript/pnpm-workspace.yaml"
      - "typescript/turbo.json"
      - ".github/workflows/typescript-deploy-presets.yml"
  workflow_dispatch:

jobs:
  deploy-presets:
    name: Deploy Preset Validation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: typescript/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm -r build

      - name: Build and validate every preset
        run: pnpm run ci:deploy-presets

      # Boots/invokes the generated artifacts: docker is started as a real
      # process (requests + SIGTERM drain), vercel's generated handler is
      # invoked in-process, cloudflare is static-only (see script header).
      - name: Boot generated preset artifacts
        run: pnpm run ci:deploy-presets:boot
