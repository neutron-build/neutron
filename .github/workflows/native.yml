name: Native

on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native.yml"

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: the `*.web.test.ts` suites drive a global
          # `navigator`, which Node only provides from 21 onward. On 20 they
          # throw at `Object.defineProperty(navigator, ...)` and 36 tests fail
          # for a reason that has nothing to do with the code under test.
          # 22 is also what 9 of this repo's other workflows already use, so
          # this removes an outlier rather than introducing one.
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: native/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: native
        run: pnpm install --frozen-lockfile

      # Without pnpm-workspace.yaml, `pnpm install` installs the root project only
      # and still exits 0 — an empty install that makes every later step vacuous.
      # Assert each workspace project really got its dependencies.
      - name: Assert the workspace actually installed
        working-directory: native
        run: |
          set -eu
          for dir in packages/neutron-native packages/neutron-native-cli \
                     packages/neutron-native-styling examples/hello-world; do
            if [ ! -d "$dir/node_modules" ]; then
              echo "::error::$dir has no node_modules - the workspace did not install"
              exit 1
            fi
            echo "ok: $dir"
          done

      # The example resolves @neutron-build/native through its "types" entry in
      # dist/, so the packages must be built before it can be typechecked.
      - name: Build packages
        working-directory: native
        run: pnpm -r build

      - name: Typecheck
        working-directory: native
        run: pnpm -r typecheck

      # Wired 2026-08-19. This job deliberately stopped at typecheck while the
      # suites were red, so `pnpm test` had never run in CI. They were not
      # actually failing: `lib` predated ES2019 and there were no node types,
      # so 6 suites failed to COMPILE, and one test file was a script rather
      # than a module so its top-level `let` collided with the same name in
      # the built .d.ts. 36 suites / 412 tests pass now. Runs after the build
      # step above, because cross-package imports resolve through dist/.
      - name: Test
        working-directory: native
        run: pnpm test
