name: Nucleus Release

on:
  push:
    branches: [main]
    paths:
      - "nucleus/**"
      - ".github/workflows/nucleus-release.yml"
    tags:
      - "nucleus/v*"
  pull_request:
    paths:
      - "nucleus/**"
      - ".github/workflows/nucleus-release.yml"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # CI: runs on every push / PR that touches nucleus/
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: nucleus

      - name: Build
        run: cargo build --bin nucleus
        working-directory: nucleus

      - name: Test (lib only — skips slow stress tests)
        run: cargo test --lib -q
        working-directory: nucleus

      - name: Test core-only library
        run: cargo test --no-default-features --lib -q
        working-directory: nucleus

      - name: Test integrations
        run: cargo test --test '*' -q -- --test-threads=1
        working-directory: nucleus

  clippy:
    name: Clippy
    # Release gate: the tree is clippy-clean at `--all-targets -D warnings`, so
    # lint regressions block both branches/PRs and release tags.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nucleus
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: nucleus

  # ---------------------------------------------------------------------------
  # Release builds: only on nucleus/v* tags, after CI passes
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    needs: [test, clippy]
    if: startsWith(github.ref, 'refs/tags/nucleus/v')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os: linux
            arch: amd64
            cross: false

          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            os: linux
            arch: arm64
            cross: true

          - runner: macos-latest
            target: aarch64-apple-darwin
            os: darwin
            arch: arm64
            cross: false

          - runner: macos-15-intel
            target: x86_64-apple-darwin
            os: darwin
            arch: amd64
            cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: nucleus
          key: release-${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --bin nucleus --target ${{ matrix.target }}
        working-directory: nucleus
        env:
          CARGO_PROFILE_RELEASE_STRIP: "true"
          CARGO_PROFILE_RELEASE_LTO: "thin"

      - name: Build (cross)
        if: ${{ matrix.cross }}
        run: cross build --release --bin nucleus --target ${{ matrix.target }}
        working-directory: nucleus
        env:
          CARGO_PROFILE_RELEASE_STRIP: "true"
          CARGO_PROFILE_RELEASE_LTO: "thin"

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/nucleus/}" >> "$GITHUB_OUTPUT"

      - name: Package
        id: package
        run: |
          # Unversioned asset name so /releases/latest/download/<asset> resolves
          # without needing to know the version in the URL.
          ARCHIVE="nucleus-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
          tar czf "$ARCHIVE" -C "nucleus/target/${{ matrix.target }}/release" nucleus
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nucleus-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ steps.package.outputs.archive }}
          retention-days: 1

  # ---------------------------------------------------------------------------
  # GitHub Release: collect all platform archives, checksum, publish
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/nucleus/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: nucleus-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: |
          sha256sum nucleus-*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/nucleus/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Nucleus ${{ steps.version.outputs.version }}"
          generate_release_notes: true
          files: |
            artifacts/nucleus-*.tar.gz
            artifacts/checksums.txt
          body: |
            ## Nucleus ${{ steps.version.outputs.version }}

            Multi-model database engine — SQL, KV, Graph, Document, Vector, FTS, TimeSeries, Blob, Columnar, Datalog, PubSub, Geo, and Streams in a single binary.

            ### Quick start

            ```bash
            # Download and extract
            tar xzf nucleus-<os>-<arch>.tar.gz

            # Start the server (PostgreSQL wire protocol on :5432)
            ./nucleus serve

            # Connect with any PostgreSQL client
            psql -h 127.0.0.1 -p 5432
            ```

            ### Verify checksums

            ```bash
            sha256sum -c checksums.txt
            ```

            ### Platforms

            | File | OS | Arch |
            |------|----|------|
            | `nucleus-linux-amd64.tar.gz` | Linux | x86_64 |
            | `nucleus-linux-arm64.tar.gz` | Linux | aarch64 |
            | `nucleus-darwin-arm64.tar.gz` | macOS | Apple Silicon |
            | `nucleus-darwin-amd64.tar.gz` | macOS | Intel |

  # ---------------------------------------------------------------------------
  # Docker: build and push linux/amd64 image to GHCR on main or release tag
  # ---------------------------------------------------------------------------
  docker:
    name: Docker (linux/amd64)
    needs: [test, clippy]
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/nucleus/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/neutron-build/nucleus
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=match,pattern=nucleus/v(.*),group=1

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./nucleus
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
