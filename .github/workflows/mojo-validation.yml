name: Mojo Core Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mojo/**"
      - ".github/workflows/mojo-validation.yml"
  pull_request:
    paths:
      - "mojo/**"
      - ".github/workflows/mojo-validation.yml"

jobs:
  validate-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pixi
        uses: prefix-dev/setup-pixi@8eaba7c61d661f73d558b0b477156b7b62667fa4 # v0.8.4
        with:
          manifest-path: mojo/neutron-mojo/mojoproject.toml

      - name: Run core validation
        run: pixi run --manifest-path mojo/neutron-mojo/mojoproject.toml bash mojo/scripts/validate-core.sh

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mojo-core-validation-reports
          path: mojo/reports/
