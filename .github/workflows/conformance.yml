name: Cross-SDK Contract Conformance

on:
  push:
    branches: [main]
    paths:
      - "conformance/**"
      - "go/**"
      - "python/**"
      - "rust/**"
      - "elixir/**"
      - "zig/**"
      - "typescript/packages/neutron/**"
      - "FRAMEWORK_CONTRACT.md"
      - ".github/workflows/conformance.yml"
  pull_request:
    paths:
      - "conformance/**"
      - "go/**"
      - "python/**"
      - "rust/**"
      - "elixir/**"
      - "zig/**"
      - "typescript/packages/neutron/**"
      - "FRAMEWORK_CONTRACT.md"
      - ".github/workflows/conformance.yml"
  schedule:
    - cron: "0 8 * * 1"

jobs:
  conformance:
    name: contract matrix (go × rust × python × ts × elixir × zig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Each SDK's runner descriptor skips gracefully when its toolchain is
      # absent (never fails), so the gate stays green even if one setup breaks —
      # it only goes red on a real contract FAIL. We provision all six.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Python SDK
        # Install the SDK itself, not a hand-listed subset of its dependencies.
        #
        # This used to be `pip install starlette pydantic uvicorn` — three of the
        # eight packages `python/pyproject.toml` requires. The conformance app
        # imports `neutron`, which imports `structlog`, so it died at import and
        # the matrix reported `[python] UNAVAILABLE — server did not become
        # healthy` while the workflow went GREEN. Python had never once been in
        # the contract matrix the job is named after.
        #
        # A hand-maintained dependency list drifts from the real requirements
        # silently and forever; `-e ./python` cannot.
        run: pip install -e ./python

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"

      - name: Set up Zig
        # Exact tagged release, matching zig/build.zig.zon's pin. The SDK and
        # its adapter do not compile on 0.16 (std API removals), and a range
        # like 0.15.* could silently move to a 0.15.x the SDK has never seen.
        # The runner's zig descriptor resolves the toolchain from PATH; without
        # this step --strict fails on a registered-but-absent SDK.
        uses: mlugg/setup-zig@v2
        with:
          version: "0.15.2"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # Every other workflow pins this. Without it the action looks for a
          # `packageManager` key in a root package.json that does not exist,
          # and the whole contract matrix fails before it runs a single check.
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      # Builds the TS SDK dist the conformance app boots from.
      - name: Build TypeScript SDK
        # Packages only, as typescript-publish.yml does. A bare `pnpm build`
        # also builds apps/ and examples/, which invoke the `neutron-ts` binary
        # that does not exist until the core package is built and linked — so
        # the whole matrix died on `neutron-ts: not found` before running a
        # single contract check. The conformance app needs the SDK dist, and
        # nothing else here does.
        run: pnpm install && pnpm --filter "./packages/*" run build
        working-directory: typescript

      - name: Validate the contract IR
        # Before booting five SDKs against it: if the IR and the prose contract
        # disagree, every result below is measured against the wrong contract.
        run: node runner/validate-ir.mjs
        working-directory: conformance

      - name: Run conformance matrix
        # --strict: every SDK must actually be exercised. This job provisions
        # all four toolchains, so an SDK reported absent here means the setup
        # broke — and an SDK that booted but never became healthy is a defect
        # either way. Without this the matrix was green while Python had never
        # run in it at all.
        run: node run.mjs --strict
        working-directory: conformance/runner
