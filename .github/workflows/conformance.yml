name: Cross-SDK Contract Conformance

on:
  push:
    branches: [main]
    paths:
      - "conformance/**"
      - "go/**"
      - "python/**"
      - "rust/**"
      - "typescript/packages/neutron/**"
      - ".github/workflows/conformance.yml"
  pull_request:
    paths:
      - "conformance/**"
      - "go/**"
      - "python/**"
      - "rust/**"
      - "typescript/packages/neutron/**"
      - ".github/workflows/conformance.yml"
  schedule:
    - cron: "0 8 * * 1"

jobs:
  conformance:
    name: contract matrix (go × rust × python × ts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Each SDK's runner descriptor skips gracefully when its toolchain is
      # absent (never fails), so the gate stays green even if one setup breaks —
      # it only goes red on a real contract FAIL. We provision all four.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python contract deps
        run: pip install starlette pydantic uvicorn

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # Every other workflow pins this. Without it the action looks for a
          # `packageManager` key in a root package.json that does not exist,
          # and the whole contract matrix fails before it runs a single check.
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      # Builds the TS SDK dist the conformance app boots from.
      - name: Build TypeScript SDK
        # Packages only, as typescript-publish.yml does. A bare `pnpm build`
        # also builds apps/ and examples/, which invoke the `neutron-ts` binary
        # that does not exist until the core package is built and linked — so
        # the whole matrix died on `neutron-ts: not found` before running a
        # single contract check. The conformance app needs the SDK dist, and
        # nothing else here does.
        run: pnpm install && pnpm --filter "./packages/*" run build
        working-directory: typescript

      - name: Run conformance matrix
        run: node run.mjs
        working-directory: conformance/runner
