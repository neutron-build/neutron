name: Nucleus Sanitizers (Linux)

# AddressSanitizer + LeakSanitizer run for Nucleus — the memory-safety / leak
# check that can't run on macOS. Slow (instrumented), so it runs weekly and on
# demand rather than on every push.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  sanitizers:
    name: ASan + LSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust nightly + std target
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: nucleus

      - name: ASan + LSan leak check
        run: bash scripts/linux-leak-check.sh
        working-directory: nucleus
