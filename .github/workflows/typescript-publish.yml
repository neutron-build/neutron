name: Publish TypeScript Packages

on:
  push:
    tags:
      - 'ts/v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: typescript
      # Build/test only the publishable packages. The apps (site, playground)
      # are private and not released; their build invokes the neutron-ts bin,
      # which pnpm cannot link in a clean install until the CLI is built.
      - run: pnpm --filter "./packages/*" run build
        working-directory: typescript
      - run: pnpm --filter "./packages/*" run test
        working-directory: typescript

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: typescript
      - run: pnpm --filter "./packages/*" run build
        working-directory: typescript
      - run: pnpm publish -r --access public --no-git-checks
        working-directory: typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
