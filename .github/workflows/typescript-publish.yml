name: Validate TypeScript Release

on:
  push:
    tags:
      - 'ts/v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEUTRON_TEST_REDIS_URL: redis://127.0.0.1:6379
      NEUTRON_REDIS_LIVE_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: typescript
      # Build/test only the publishable packages. The apps (site, playground)
      # are private and not released; their build invokes the neutron-ts bin,
      # which pnpm cannot link in a clean install until the CLI is built.
      - run: pnpm --filter "./packages/*" run build
        working-directory: typescript
      - run: pnpm --filter "./packages/*" run test
        working-directory: typescript
