name: Zig Systems Library

on:
  push:
    branches: [main]
    paths:
      - "zig/**"
      - ".github/workflows/zig.yml"
  pull_request:
    paths:
      - "zig/**"
      - ".github/workflows/zig.yml"

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        zig-version: ["0.15.2"]
    steps:
      - uses: actions/checkout@v4

      # v2, not v1: v1 resolves versions through the NIGHTLY builds index, so
      # it 404'd on 0.15.2 from every mirror and from ziglang.org itself, even
      # though 0.15.2 is a tagged release listed in download/index.json. The
      # version pin and the action bump have to land together.
      - name: Install Zig ${{ matrix.zig-version }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig-version }}

      - name: Build (full stack)
        run: zig build
        working-directory: zig

      - name: Test
        run: zig build test
        working-directory: zig

  build-layers:
    name: Layer Combinations
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: "Wire only (Layer 0)"
            flags: "-Dlayer1=false -Dlayer2=false -Dlayer3=false -Dnucleus=false"
          - name: "Wire + HAL (Layers 0-1)"
            flags: "-Dlayer2=false -Dlayer3=false -Dnucleus=false"
          - name: "No Nucleus"
            flags: "-Dnucleus=false"
    steps:
      - uses: actions/checkout@v4

      # v2: v1 resolves a version through the NIGHTLY builds index, so it
      # 404'd on 0.15.2 from every mirror and from ziglang.org itself even
      # though 0.15.2 is a tagged release. The pin change and the action bump
      # have to land together.
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.15.2"

      - name: Build — ${{ matrix.name }}
        run: zig build ${{ matrix.flags }}
        working-directory: zig
