name: Universal CLI

on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "studio/**"
      - "go/**"
      - "typescript/packages/neutron/**"
      - "typescript/packages/neutron-cli/**"
      - ".github/workflows/cli.yml"
    tags:
      - "cli/v*"
  pull_request:
    paths:
      - "cli/**"
      - "studio/**"
      - "go/**"
      - "typescript/packages/neutron/**"
      - "typescript/packages/neutron-cli/**"
      - ".github/workflows/cli.yml"

permissions:
  contents: write

jobs:
  # The CLI embeds the compiled Studio frontend (//go:embed all:dist in
  # cli/internal/studio/embed.go). studio/dist is a build artifact, not
  # committed, so build it once here and share it with every go-build job.
  studio:
    name: Build Studio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: studio
      # Studio's own suite — 27 files, 321 tests — passed locally and had never
      # run in CI: this job built the dist and shipped it without executing a
      # single one of them. Found by the S54 completeness pass, 2026-08-17.
      - name: Test Studio
        run: npm test
        working-directory: studio
      - run: npm run build
        working-directory: studio
      - uses: actions/upload-artifact@v4
        with:
          name: studio-dist
          path: studio/dist
          retention-days: 1
          if-no-files-found: error

  test:
    name: Test
    needs: studio
    runs-on: ubuntu-latest
    # Required-live Postgres for the E2E legs (migration-safety in ./cmd,
    # studio row-safety in ./internal/studio). They read NEUTRON_E2E_DATABASE_URL
    # and skip with a reason locally; NEUTRON_LIVE_REQUIRED=1 flips a missing
    # URL into a failure here so the live leg can never silently disappear.
    # Image: postgres:17 (repo workflows pin no digests; see typescript.yml).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEUTRON_E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      NEUTRON_LIVE_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Studio dist
        uses: actions/download-artifact@v4
        with:
          name: studio-dist
          path: cli/internal/studio/dist

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: cli/go.sum

      - name: Build
        run: go build -v .
        working-directory: cli

      - name: Test
        run: go test -race ./...
        working-directory: cli

      - name: Vet
        run: go vet ./...
        working-directory: cli

  # The application coordinator supervises real process trees, so its runtime
  # support is only claimed where these run natively. Windows is cross-compiled
  # below and rejects application mode at runtime.
  coordinator:
    name: Coordinator (${{ matrix.os }})
    needs: studio
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Studio dist
        uses: actions/download-artifact@v4
        with:
          name: studio-dist
          path: cli/internal/studio/dist

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: cli/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lifecycle tests
        run: go test -race -count=3 ./internal/project ./internal/supervisor
        working-directory: cli

      - name: Native two-language smoke
        run: |
          go build -o "$RUNNER_TEMP/neutron" .
          python3 examples/application/smoke.py "$RUNNER_TEMP/neutron"
        working-directory: cli

  # A Go SDK API and a Neutron TypeScript app as neutron/v1 services, run
  # outside the repository against SDKs packed from this checkout.
  coordinator-sdk:
    name: Coordinator with Neutron SDKs (${{ matrix.os }})
    needs: studio
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Studio dist
        uses: actions/download-artifact@v4
        with:
          name: studio-dist
          path: cli/internal/studio/dist

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: |
            cli/go.sum
            cli/examples/neutron-application/api/go.sum

      # Version comes from typescript/package.json packageManager.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: typescript/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build TypeScript SDK packages
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "@neutron-build/cli..." build
        working-directory: typescript

      - name: Example smoke
        run: |
          go build -o "$RUNNER_TEMP/neutron" .
          python3 examples/neutron-application/smoke.py "$RUNNER_TEMP/neutron"
        working-directory: cli

  cross-compile:
    name: Cross-compile
    needs: studio
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Studio dist
        uses: actions/download-artifact@v4
        with:
          name: studio-dist
          path: cli/internal/studio/dist

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: cli/go.sum

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -o /dev/null .
        working-directory: cli

  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    needs: [test, cross-compile]
    if: startsWith(github.ref, 'refs/tags/cli/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Studio dist
        uses: actions/download-artifact@v4
        with:
          name: studio-dist
          path: cli/internal/studio/dist

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: cli/go.sum

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/cli/v}" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: cli
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath \
            -ldflags "-s -w -X github.com/neutron-build/neutron/cli/cmd.version=${{ steps.version.outputs.version }}" \
            -o neutron .

      - name: Package
        id: package
        run: |
          # Versioned asset name; install.sh resolves
          # neutron_<version>_<os>_<arch>.tar.gz under the cli/v<version> release.
          ARCHIVE="neutron_${{ steps.version.outputs.version }}_${{ matrix.os }}_${{ matrix.arch }}.tar.gz"
          tar czf "$ARCHIVE" -C cli neutron
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: neutron-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ steps.package.outputs.archive }}
          retention-days: 1

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/cli/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: neutron-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: |
          sha256sum neutron_*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/cli/v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Neutron CLI v${{ steps.version.outputs.version }}"
          generate_release_notes: true
          files: |
            artifacts/neutron_*.tar.gz
            artifacts/checksums.txt
          body: |
            ## Neutron CLI v${{ steps.version.outputs.version }}

            The universal CLI for the Neutron ecosystem.

            ### Install

            ```bash
            curl -fsSL https://get.neutron.build | sh
            ```

            Or download the archive for your platform below, extract, and put the
            `neutron` binary on your `PATH`.

            ### Verify checksums

            ```bash
            sha256sum -c checksums.txt
            ```

            ### Platforms

            | File | OS | Arch |
            |------|----|------|
            | `neutron_${{ steps.version.outputs.version }}_linux_amd64.tar.gz` | Linux | x86_64 |
            | `neutron_${{ steps.version.outputs.version }}_linux_arm64.tar.gz` | Linux | aarch64 |
            | `neutron_${{ steps.version.outputs.version }}_darwin_arm64.tar.gz` | macOS | Apple Silicon |
            | `neutron_${{ steps.version.outputs.version }}_darwin_amd64.tar.gz` | macOS | Intel |
