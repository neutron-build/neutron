name: Universal CLI

on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "studio/**"
      - ".github/workflows/cli.yml"
    tags:
      - "cli/v*"
  pull_request:
    paths:
      - "cli/**"
      - "studio/**"
      - ".github/workflows/cli.yml"

permissions:
  contents: write

jobs:
  # The CLI embeds the compiled Studio frontend (//go:embed all:dist in
  # cli/internal/studio/embed.go). studio/dist is a build artifact, not
  # committed, so build it once here and share it with every go-build job.
  studio:
    name: Build Studio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: studio
      - run: npm run build
        working-directory: studio
      - uses: actions/upload-artifact@v4
        with:
          name: studio-dist
          path: studio/dist
          retention-days: 1
          if-no-files-found: error

  test:
    name: Test
    needs: studio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Studio dist
        uses: actions/download-artifact@v4
        with:
          name: studio-dist
          path: cli/internal/studio/dist

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: cli/go.sum

      - name: Build
        run: go build -v .
        working-directory: cli

      - name: Test
        run: go test -race ./...
        working-directory: cli

      - name: Vet
        run: go vet ./...
        working-directory: cli

  cross-compile:
    name: Cross-compile
    needs: studio
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Studio dist
        uses: actions/download-artifact@v4
        with:
          name: studio-dist
          path: cli/internal/studio/dist

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: cli/go.sum

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -o /dev/null .
        working-directory: cli

  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    needs: [test, cross-compile]
    if: startsWith(github.ref, 'refs/tags/cli/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Studio dist
        uses: actions/download-artifact@v4
        with:
          name: studio-dist
          path: cli/internal/studio/dist

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: cli/go.sum

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/cli/v}" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: cli
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath \
            -ldflags "-s -w -X github.com/neutron-build/neutron/cli/cmd.version=${{ steps.version.outputs.version }}" \
            -o neutron .

      - name: Package
        id: package
        run: |
          # Versioned asset name; install.sh resolves
          # neutron_<version>_<os>_<arch>.tar.gz under the cli/v<version> release.
          ARCHIVE="neutron_${{ steps.version.outputs.version }}_${{ matrix.os }}_${{ matrix.arch }}.tar.gz"
          tar czf "$ARCHIVE" -C cli neutron
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: neutron-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ steps.package.outputs.archive }}
          retention-days: 1

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/cli/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: neutron-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: |
          sha256sum neutron_*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/cli/v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Neutron CLI v${{ steps.version.outputs.version }}"
          generate_release_notes: true
          files: |
            artifacts/neutron_*.tar.gz
            artifacts/checksums.txt
          body: |
            ## Neutron CLI v${{ steps.version.outputs.version }}

            The universal CLI for the Neutron ecosystem.

            ### Install

            ```bash
            curl -fsSL https://get.neutron.build | sh
            ```

            Or download the archive for your platform below, extract, and put the
            `neutron` binary on your `PATH`.

            ### Verify checksums

            ```bash
            sha256sum -c checksums.txt
            ```

            ### Platforms

            | File | OS | Arch |
            |------|----|------|
            | `neutron_${{ steps.version.outputs.version }}_linux_amd64.tar.gz` | Linux | x86_64 |
            | `neutron_${{ steps.version.outputs.version }}_linux_arm64.tar.gz` | Linux | aarch64 |
            | `neutron_${{ steps.version.outputs.version }}_darwin_arm64.tar.gz` | macOS | Apple Silicon |
            | `neutron_${{ steps.version.outputs.version }}_darwin_amd64.tar.gz` | macOS | Intel |
