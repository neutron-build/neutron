name: Lean 4 Proofs

on:
  push:
    branches: [main]
    paths:
      - "lean4/**"
      - ".github/workflows/lean4.yml"
  pull_request:
    paths:
      - "lean4/**"
      - ".github/workflows/lean4.yml"
  schedule:
    - cron: "0 8 * * 1"

jobs:
  verify:
    name: lake build (machine-checked proofs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # elan reads lean4/Nucleus/lean-toolchain and installs the pinned Lean
      # (v4.14.0). The proofs have no external dependencies (no Mathlib), so the
      # build is fully reproducible and self-contained.
      - name: Install elan (Lean toolchain manager)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lake build
        uses: actions/cache@v4
        with:
          path: lean4/Nucleus/.lake/build
          key: lake-${{ runner.os }}-${{ hashFiles('lean4/Nucleus/lean-toolchain') }}-${{ hashFiles('lean4/Nucleus/**/*.lean') }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lean4/Nucleus/lean-toolchain') }}-

      # ci.sh runs the Aeneas translation step (which no-ops when Aeneas is not
      # installed — CI uses the committed hand-modeled Lean files) then verifies
      # every proof with `lake build`.
      # `lake build` going green does not by itself mean anything was CHECKED.
      # A workflow that restores a cache and compiles nothing looks identical
      # to one that verified 92 theorems. The canary hands Lean a proposition
      # that must not typecheck and fails if it is accepted.
      #
      # ci.sh then runs the axiom audit, which answers the other half: a proof
      # that elaborates can still rest on an axiom, and until 2026-08-17 two of
      # this suite's headline results rested on axioms that were FALSE. The
      # audit walks every theorem and fails on any dependency outside a
      # three-entry allow-list.
      - name: Canary (the checker must reject a false proposition)
        run: bash scripts/canary.sh
        working-directory: lean4

      - name: Verify proofs
        run: bash scripts/ci.sh
        working-directory: lean4
