name: Rust Web Framework

on:
  push:
    branches: [main]
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust

      - name: Build
        run: cargo build --workspace
        working-directory: rust

      - name: Test
        run: cargo test --workspace
        working-directory: rust

      # target/ has taken a development machine to zero bytes free twice, and
      # both times it was cleared by hand after the fact. This was wired into
      # the Nucleus workflow only, so growth in every other Rust tree stayed
      # invisible. Reports on every run; the ceiling exists so "visible" does
      # not depend on somebody reading the log. Runs from the repository root,
      # which is where the script expects to find the target directories.
      - name: Build size
        run: sh nucleus/scripts/report-build-size.sh --report-only

  # rustfmt could not be gated before 2026-08-19: `cargo fmt --check` reported
  # 991 diffs, almost all of them from files stored with CRLF, and running the
  # formatter produced a 140-file diff that had to be discarded by hand every
  # time an unrelated change touched this tree. With line endings normalised
  # repo-wide the formatter's output is stable, so it is formatted once and
  # gated here — a formatter without a gate drifts straight back.
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --check
        working-directory: rust

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust
      - run: cargo clippy --workspace -- -D warnings
        working-directory: rust
