name: Rust Web Framework

on:
  push:
    branches: [main]
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build
        run: cargo build --workspace
        working-directory: rust

      - name: Test
        run: cargo test --workspace

      # target/ has taken a development machine to zero bytes free twice, and
      # both times it was cleared by hand after the fact. This was wired into
      # the Nucleus workflow only, so growth in every other Rust tree stayed
      # invisible. Reports on every run; the ceiling exists so "visible" does
      # not depend on somebody reading the log.
      - name: Build size
        run: sh nucleus/scripts/report-build-size.sh --report-only
        working-directory: ${{ github.workspace }}
        working-directory: rust

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo clippy --workspace -- -D warnings
        working-directory: rust
