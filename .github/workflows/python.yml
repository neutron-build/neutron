name: Python

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      # The conformance job below runs code that lives OUTSIDE python/ (the
      # shared runner, the IR, the Python adapter). Without these entries a
      # change there breaks Python's contract while this workflow never runs —
      # the exact path-filter blind spot that let workflows sit red for months.
      - "conformance/runner/**"
      - "conformance/adapters/python/**"
      - "conformance/contract-ir.json"
      - "conformance/known-skips.json"
      - "FRAMEWORK_CONTRACT.md"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "python/**"
      - "conformance/runner/**"
      - "conformance/adapters/python/**"
      - "conformance/contract-ir.json"
      - "conformance/known-skips.json"
      - "FRAMEWORK_CONTRACT.md"
      - ".github/workflows/python.yml"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: python
        run: pip install -e ".[test]"

      - name: Run tests
        working-directory: python
        run: pytest -v

  conformance:
    # Python's own gate on FRAMEWORK_CONTRACT.md. Before this job existed the
    # contract surface was checked only by conformance.yml and sdk-live.yml —
    # workflows whose names say nothing about Python, and whose path filters
    # can therefore hide a Python contract break from a Python-only change.
    name: Contract conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install the Python SDK
        # Runtime deps only, matching conformance.yml: the conformance app
        # imports `neutron`, which needs the full dependency set, not a
        # hand-listed subset that drifts from pyproject.toml.
        run: pip install -e ./python

      - name: Validate the contract IR
        # The conformance assertions below read contract-ir.json directly; if
        # the IR and the prose contract disagree, every result is measured
        # against the wrong contract.
        run: node runner/validate-ir.mjs
        working-directory: conformance

      - name: Run the Python leg of the contract matrix
        # --strict: the toolchain is provisioned right here, so an "absent"
        # python SDK means the setup broke — and must fail, not warn. Without
        # it the matrix can go green while Python was never exercised.
        run: node runner/run.mjs python --strict
        working-directory: conformance

  build:
    # Build and validate the neutron-framework distribution. Publish deliberately NOT
    # here: releasing is done locally by design (2FA/OTP), so this job stops at
    # proving the sdist and wheel are buildable and twine-clean.
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: pip install build twine

      - name: Build sdist and wheel
        working-directory: python
        run: python -m build

      - name: Validate the artifacts
        working-directory: python
        run: twine check dist/*
