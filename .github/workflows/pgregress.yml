name: PostgreSQL Differential

# Runs `nucleus/compat/pgregress`: a curated SQL corpus executed through the
# SAME psql client against a real PostgreSQL 17 and a release Nucleus, with the
# outputs normalized and diffed. A script passes only when the two agree.
#
# It is here because it was not. The harness found roughly 35 real correctness
# defects when it was written (2026-07-23) and then ran only when somebody
# remembered to, which for this repo is the documented way a gate stops being
# one — its own README recorded a pass count from three weeks earlier as
# current status. Its first CI run found four more: a silently ignored
# aggregate FILTER, a silently ignored within-aggregate ORDER BY, `GROUP BY <n>`
# grouping every row into one bucket, and unparsed `BETWEEN SYMMETRIC`.
#
# PostgreSQL is installed from PGDG rather than using the runner's preinstalled
# server: the corpus is diffed against 17 specifically, and a different minor
# family changes enough output detail (error wording, numeric display) to make
# a deviation ambiguous — which is the one thing a differential harness may not
# be.

on:
  push:
    branches: [main]
    paths:
      - "nucleus/**"
      - ".github/workflows/pgregress.yml"
  pull_request:
    paths:
      - "nucleus/**"
      - ".github/workflows/pgregress.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: 1

jobs:
  pgregress:
    name: Nucleus vs PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nucleus

      # Step-level timeout, deliberately well under the job's 40. On
      # 2026-08-18 an Ubuntu mirror stalled mid-`apt-get update` and this step
      # sat on it for 39 minutes until the JOB timeout cancelled the run — so a
      # network hiccup in a dependency install consumed the entire budget and
      # left a non-success run on main that looks exactly like a real
      # deviation. Failing fast here is the difference between "the mirror was
      # slow" and "the differential harness found something", which is the one
      # distinction this workflow exists to make.
      - name: Install PostgreSQL 17
        timeout-minutes: 14
        run: |
          set -euo pipefail
          # Every network step here is bounded and retried, because a stalled
          # apt mirror is the single most common way this job dies and it is
          # not a Nucleus failure.
          #
          # History, because the fix has now been wrong twice in the same way:
          #
          #  1. The retry loop alone did nothing. A mirror that STALLS rather
          #     than failing never returns, so `if ...; then` never evaluated
          #     and attempts 2 and 3 were unreachable. `Acquire::http::Timeout`
          #     bounds a single connection, not an update that keeps trickling.
          #  2. Bounding only `apt-get update` was still not enough. On
          #     2026-08-19 the step hit its 8-minute cap AFTER the update
          #     retries, inside the unbounded installs below -- which each run
          #     their own network fetch, and `apt.postgresql.org.sh` runs
          #     another `apt-get update` of its own.
          #
          # So: bound every command that touches the network, and size the step
          # budget to fit the worst case rather than the happy path
          # (3x120s update + 3x180s per install fits inside 14 minutes).
          retry() {
            local what="$1"; shift
            local limit="$1"; shift
            for attempt in 1 2 3; do
              if sudo timeout "$limit" "$@"; then
                return 0
              fi
              echo "$what failed or stalled (attempt $attempt of 3), retrying"
              sleep 5
            done
            echo "::error::$what did not succeed in 3 bounded attempts -- apt mirror stall, not a Nucleus failure"
            return 1
          }
          retry "apt-get update" 120 apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          retry "install postgresql-common" 180 apt-get install -y postgresql-common
          retry "pgdg repository setup" 180 /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          retry "install postgresql-17" 180 apt-get install -y postgresql-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Confirm the server under test is really 17
        run: |
          set -euo pipefail
          # R8: an unpinned `postgres` on PATH is how this would silently diff
          # against the runner's preinstalled 16 and report deviations that are
          # version differences. Assert before running anything.
          which initdb pg_ctl psql
          initdb --version
          initdb --version | grep -q ' 17\.' || {
            echo "expected PostgreSQL 17 on PATH, got: $(initdb --version)"; exit 1; }

      - name: Run the differential corpus
        run: sh run.sh
        working-directory: nucleus/compat/pgregress

      - name: Upload deviation diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pgregress-diffs-${{ github.run_id }}
          path: nucleus/compat/pgregress/last_*.diff
          if-no-files-found: ignore
          retention-days: 30
