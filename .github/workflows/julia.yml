name: Julia SDK

on:
  push:
    branches: [main]
    paths:
      - "julia/**"
      - ".github/workflows/julia.yml"
  pull_request:
    paths:
      - "julia/**"
      - ".github/workflows/julia.yml"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        julia-version: ["1.9", "1.10", "1"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Julia ${{ matrix.julia-version }}
        uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
        with:
          version: ${{ matrix.julia-version }}

      - name: Cache Julia packages
        uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2

      - name: Install dependencies
        run: julia --project=julia -e 'using Pkg; Pkg.instantiate()'

      - name: Run tests
        run: julia --project=julia -e 'using Pkg; Pkg.test()'
