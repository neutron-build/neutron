name: Desktop (Tauri)

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check Library Crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        # NOTE: do not add libappindicator3-dev here. It declares
        # `Conflicts: libayatana-appindicator3-dev` (and libappindicator3-1
        # conflicts with libayatana-appindicator3-1), so requesting both makes
        # apt exit 100 with "held broken packages" on both 22.04 and 24.04.
        # Tauri 2 uses the ayatana variant; that one is the correct dependency.
        run: |
          set -euo pipefail
          # Bounded and retried: a stalled apt mirror is the most common way
          # these jobs die, and an unbounded `apt-get update` that trickles
          # forever burns the whole job budget rather than failing. Same fix,
          # and same reasoning, as `pgregress.yml`.
          retry() {
            local what="$1"; shift
            local limit="$1"; shift
            for attempt in 1 2 3; do
              if sudo timeout "$limit" "$@"; then
                return 0
              fi
              echo "$what failed or stalled (attempt $attempt of 3), retrying"
              sleep 5
            done
            echo "::error::$what did not succeed in 3 bounded attempts -- apt mirror stall, not a build failure"
            return 1
          }
          retry "apt-get update" 120 apt-get update
          retry "install desktop build dependencies" 240 apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Build (library crates only)
        run: cargo build --workspace --exclude neutron-desktop-starter
        working-directory: desktop

      - name: Clippy (library crates only)
        run: cargo clippy --workspace --exclude neutron-desktop-starter -- -D warnings
        working-directory: desktop

      # These 48 tests already existed in the tree but no job ran them, so a
      # green "Check" said nothing about them. Two only failed once actually
      # compiled: the dev_server tests did not build under edition 2024, and
      # the embedded-Nucleus lifecycle test failed outright.
      - name: Test (library crates only)
        run: cargo test --workspace --exclude neutron-desktop-starter
        working-directory: desktop

  # The path filter above fires on any change under desktop/, which includes
  # the TypeScript bridge in desktop/packages/desktop — previously nothing in
  # this workflow type-checked or tested it.
  web:
    name: TypeScript Bridge Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/packages/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: desktop/packages/desktop

      - name: Test
        run: npm test
        working-directory: desktop/packages/desktop
