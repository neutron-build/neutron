name: ORM installed artifacts

# R02 / VERIFICATION V17: the ORM as a user installs it, not as the monorepo
# builds it. Three gates, each on artifacts the previous jobs produced:
#
#   sql-installed  pnpm-packs @neutron-build/sql (the publish path), checks
#                  the tarball, and installs it into clean pg-only and
#                  postgres.js-only projects outside the checkout: exports,
#                  declarations (TypeScript 5.7.2 and 5.9.3), every README
#                  example compiled, no optional-peer leakage, a live round
#                  trip per driver — on both Node lines the package claims.
#   studio-embed   builds Studio on each published OS (Linux, macOS), embeds
#                  that exact build (its studio-manifest.json) in the CLI,
#                  packages the CLI through cli/scripts/package.sh (the
#                  release script), and opens the
#                  binary's served UI in Chrome. A stale embed fails the Go
#                  tests and the gate.
#   onboarding     the packed tarball + the packaged Linux CLI in fresh
#                  projects, driven by the README and the CLI reference:
#                  schema -> export -> generate -> apply -> query -> Studio
#                  edit -> inspect, and a legacy-history upgrade.
#
# SDK consumers additionally cover neutron-nucleus and neutron-data on both
# Node lines, using installed tarballs and a freshly built live engine. Data
# Drizzle library declaration refusals are recorded separately from supported
# strict application typing; importing a model never certifies its parity.
#
# Nothing is published: artifacts live for one day inside this run.

on:
  push:
    branches: [main]
    paths:
      - "typescript/packages/neutron-sql/**"
      - "typescript/packages/neutron-nucleus/**"
      - "typescript/packages/neutron-data/**"
      - "typescript/packages/neutron/src/server/session*.ts"
      - "go/neutronauth/**"
      - "go/go.mod"
      - "go/go.sum"
      - "typescript/scripts/installed-sdk*/**"
      - "typescript/scripts/installed-sdk-gate.mjs"
      - "typescript/pnpm-lock.yaml"
      - "nucleus/**"
      - "conformance/live/scripts/**"
      - "cli/**"
      - "studio/**"
      - "typescript/apps/site/src/content/docs/cli/commands.mdx"
      - ".github/workflows/orm-artifacts.yml"
  pull_request:
    paths:
      - "typescript/packages/neutron-sql/**"
      - "typescript/packages/neutron-nucleus/**"
      - "typescript/packages/neutron-data/**"
      - "typescript/packages/neutron/src/server/session*.ts"
      - "go/neutronauth/**"
      - "go/go.mod"
      - "go/go.sum"
      - "typescript/scripts/installed-sdk*/**"
      - "typescript/scripts/installed-sdk-gate.mjs"
      - "typescript/pnpm-lock.yaml"
      - "nucleus/**"
      - "conformance/live/scripts/**"
      - "cli/**"
      - "studio/**"
      - "typescript/apps/site/src/content/docs/cli/commands.mdx"
      - ".github/workflows/orm-artifacts.yml"

jobs:
  sql-installed:
    name: neutron-sql installed artifact (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEUTRON_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      NEUTRON_LIVE_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: typescript/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: typescript
      - name: Pack, install and check (pg only, postgres.js only)
        run: node scripts/installed-gate.mjs --keep-tarball "$RUNNER_TEMP/pack" --out installed-gate.local.json
        working-directory: typescript/packages/neutron-sql
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neutron-sql-installed-node${{ matrix.node }}-${{ github.run_id }}
          path: typescript/packages/neutron-sql/installed-gate.local.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: matrix.node == 22
        with:
          name: neutron-sql-tarball
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 1

  sdk-engine:
    name: Build engine for installed SDK consumers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nucleus
      - run: cargo build --release --bin nucleus --features server
        working-directory: nucleus
      - uses: actions/upload-artifact@v4
        with:
          name: nucleus-bin-installed
          path: nucleus/target/release/nucleus
          if-no-files-found: error
          retention-days: 1

  sdk-installed:
    name: neutron-${{ matrix.package }} installed artifact (Node ${{ matrix.node }})
    needs: sdk-engine
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        package: [nucleus, data]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEUTRON_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
      NEUTRON_NUCLEUS_TEST_URL: postgres://postgres@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nucleus-bin-installed
          path: ${{ runner.temp }}/installed-engine
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: typescript/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter '@neutron-build/nucleus' --filter '@neutron-build/data' --filter '@neutron-build/core'
        working-directory: typescript
      - uses: actions/setup-go@v5
        if: matrix.package == 'nucleus'
        with:
          go-version: "1.26"
          cache-dependency-path: go/go.sum
      - name: Install authentication test dependencies
        if: matrix.package == 'nucleus'
        run: |
          # pg belongs to the consuming application, not the core package.
          # Install it outside the checkout and expose it only to this test run.
          npm install --prefix "$RUNNER_TEMP/auth-driver" --no-audit --no-fund --ignore-scripts pg@8.22.0
          ln -s "$RUNNER_TEMP/auth-driver/node_modules/pg" typescript/packages/neutron/node_modules/pg
      - name: Start this source's engine
        run: |
          chmod +x "$RUNNER_TEMP/installed-engine/nucleus"
          NUCLEUS_BIN="$RUNNER_TEMP/installed-engine/nucleus" sh conformance/live/scripts/start-engine.sh 55432 "$RUNNER_TEMP/nucleus-installed"
      - name: Verify authentication against PostgreSQL and this source's engine
        if: matrix.package == 'nucleus'
        env:
          NEUTRON_LIVE_REQUIRED: "1"
        run: |
          set -euo pipefail
          for runtime in postgres nucleus; do
            if [ "$runtime" = postgres ]; then
              export NEUTRON_AUTH_TEST_DATABASE_URL="$NEUTRON_TEST_PG_URL"
            else
              export NEUTRON_AUTH_TEST_DATABASE_URL="$NEUTRON_NUCLEUS_TEST_URL"
            fi
            (cd go && go test -race -json ./neutronauth) > "$RUNNER_TEMP/auth-$runtime-go.jsonl"
            (cd typescript/packages/neutron && pnpm exec vitest run src/server/session.test.ts src/server/session-sql.integration.test.ts --maxWorkers=1 --fileParallelism=false --reporter=json --outputFile="$RUNNER_TEMP/auth-$runtime-ts.json")
            node --input-type=module - "$RUNNER_TEMP/auth-$runtime-go.jsonl" "$RUNNER_TEMP/auth-$runtime-ts.json" <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const events = readFileSync(process.argv[2], 'utf8').trim().split('\n').map(JSON.parse);
          assert.ok(events.some(event => event.Test && event.Action === 'pass'), 'Go auth suite was empty');
          assert.ok(!events.some(event => event.Action === 'skip' || event.Action === 'fail'), 'Go auth skipped or failed');
          const tests = JSON.parse(readFileSync(process.argv[3], 'utf8'));
          assert.ok(tests.numTotalTests > 0, 'TS auth suite was empty');
          assert.equal(tests.numFailedTests, 0);
          assert.equal(tests.numPendingTests, 0);
          assert.equal(tests.numTodoTests, 0);
          assert.equal(tests.numPassedTests, tests.numTotalTests);
          JS
          done
      - name: Pack and install into real clean consumers
        run: node typescript/scripts/installed-sdk-gate.mjs --package '${{ matrix.package }}' --keep-tarball "$RUNNER_TEMP/sdk-pack" --out installed-sdk.local.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neutron-${{ matrix.package }}-installed-node${{ matrix.node }}-${{ github.run_id }}
          path: |
            installed-sdk.local.json
            ${{ runner.temp }}/auth-*-go.jsonl
            ${{ runner.temp }}/auth-*-ts.json
            ${{ runner.temp }}/nucleus-installed/server.log
          if-no-files-found: warn
          retention-days: 14
      - name: Stop owned engine
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/nucleus-installed/server.pid"; then
            kill "$(cat "$RUNNER_TEMP/nucleus-installed/server.pid")" || true
          fi

  studio-embed:
    name: Studio embed and CLI archive (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The published CLI targets (cli.yml release). Windows is not
        # published; cli.yml's cross-compile job keeps it building.
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build Studio (writes dist/studio-manifest.json)
        run: npm ci && npm run build
        working-directory: studio
      - name: Embed this build
        run: rm -rf cli/internal/studio/dist && cp -R studio/dist cli/internal/studio/dist
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: cli/go.sum
      - name: Embed checks (manifest, current sources, server refusal)
        run: go test ./internal/studio -run 'Embed|StudioSource|SPAHandler' -count=1
        working-directory: cli
      - name: Package the CLI as a release does
        run: |
          archive=$(sh cli/scripts/package.sh 0.0.0-ci "$(go env GOOS)" "$(go env GOARCH)" "$RUNNER_TEMP")
          mkdir -p "$RUNNER_TEMP/cli"
          tar -xzf "$archive" -C "$RUNNER_TEMP/cli"
          "$RUNNER_TEMP/cli/neutron" version | grep -F "neutron cli  0.0.0-ci"
          echo "CLI_BIN=$RUNNER_TEMP/cli/neutron" >> "$GITHUB_ENV"
          echo "CLI_ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Served Studio is this build, and renders in Chrome
        run: node scripts/embed-gate.mjs --cli "$CLI_BIN" --out embed-gate.local.json
        working-directory: studio
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-embed-${{ matrix.os }}-${{ github.run_id }}
          path: studio/embed-gate.local.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: neutron-cli-linux
          path: ${{ env.CLI_ARCHIVE }}
          if-no-files-found: error
          retention-days: 1

  onboarding:
    name: Onboarding from the docs (fresh + legacy upgrade)
    needs: [sql-installed, studio-embed]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEUTRON_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: neutron-sql-tarball
          path: ${{ runner.temp }}/pack
      - uses: actions/download-artifact@v4
        with:
          name: neutron-cli-linux
          path: ${{ runner.temp }}/archive
      - name: Install the packaged CLI
        run: |
          mkdir -p "$RUNNER_TEMP/cli"
          tar -xzf "$RUNNER_TEMP"/archive/neutron_*_linux_amd64.tar.gz -C "$RUNNER_TEMP/cli"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: studio
      - name: Fresh project and legacy upgrade, from the docs
        run: node scripts/onboarding.mjs --cli "$RUNNER_TEMP/cli/neutron" --tarball "$(ls "$RUNNER_TEMP"/pack/*.tgz)" --out onboarding.local.json
        working-directory: studio
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onboarding-${{ github.run_id }}
          path: studio/onboarding.local.json
          if-no-files-found: warn
          retention-days: 14
