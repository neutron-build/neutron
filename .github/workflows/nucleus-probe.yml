name: Nucleus Probe Suite

# Differential / metamorphic / invariant / crash / recovery / concurrency /
# efficiency / security fuzz harnesses for the Nucleus engine. Each harness
# (src/bin/probe_*.rs + the SQL differential `fuzz`) exits non-zero on a finding;
# scripts/probe.sh runs them all.
#
#   - PRs / pushes touching nucleus: a short ("ci") pass as a gate.
#   - Nightly: a thorough ("full") pass with many more iterations/seeds.
#   - Manually dispatchable with a chosen scale.

on:
  push:
    branches: [main]
    paths:
      - "nucleus/**"
      - ".github/workflows/nucleus-probe.yml"
  pull_request:
    paths:
      - "nucleus/**"
      - ".github/workflows/nucleus-probe.yml"
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC nightly
  workflow_dispatch:
    inputs:
      scale:
        description: "Probe scale (ci | full)"
        required: false
        default: "full"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: 1

jobs:
  probe:
    name: Probe suite
    runs-on: ubuntu-latest
    # The nightly/full run can take a while; cap it generously.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: nucleus
      - name: Select scale
        id: scale
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "scale=full" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.scale }}" ]; then
            echo "scale=${{ github.event.inputs.scale }}" >> "$GITHUB_OUTPUT"
          else
            echo "scale=ci" >> "$GITHUB_OUTPUT"
          fi
      - name: Run probe suite (${{ steps.scale.outputs.scale }})
        run: PROBE_SCALE=${{ steps.scale.outputs.scale }} bash scripts/probe.sh
        working-directory: nucleus
      # Uploaded on success too, deliberately. This used to be `if: failure()`,
      # which combined with probe.sh deleting each log on PASS meant a green run
      # left no evidence of what it had actually executed. Several of these
      # harnesses can exit 0 without exercising the property they advertise
      # (V20 NU-359..NU-383), so "it passed" is only worth what the log proves.
      - name: Upload probe commands and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nucleus-probe-${{ github.run_id }}
          path: nucleus/probe-artifacts
          if-no-files-found: ignore
          retention-days: 30
