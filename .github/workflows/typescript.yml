name: TypeScript Framework

on:
  push:
    branches: [main]
    paths:
      - "typescript/**"
      - ".github/workflows/typescript.yml"
  pull_request:
    paths:
      - "typescript/**"
      - ".github/workflows/typescript.yml"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: typescript

      - name: Build
        run: pnpm build
        working-directory: typescript

      - name: Test
        run: pnpm test
        working-directory: typescript

      # Render guards: rebuilds the playground with the docker preset and
      # asserts the SSG golden HTML matches the committed snapshot byte-for-byte
      # (after normalizing build-time timestamps) and the gzipped server bundle
      # stays under budget. Catches drift in the shared render core.
      - name: Render guards (golden HTML + bundle budget)
        run: node scripts/render-guards.mjs
        working-directory: typescript

      # Both of these existed as scripts and neither ran in CI, while
      # docs/react-compat.md claimed the dual-runtime lane was covered. A-007.
      - name: Dual-runtime smoke (preact + react-compat)
        run: pnpm run ci:runtime-compat
        working-directory: typescript

      - name: React ecosystem compatibility matrix
        run: pnpm run ci:compat-matrix
        working-directory: typescript

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - run: pnpm install
        working-directory: typescript

      # Build before typechecking. Workspace packages resolve through their
      # published entry points (`types: dist/index.d.ts`), so on a fresh
      # checkout `@neutron-build/ai` and `@neutron-build/nucleus` do not exist
      # as far as tsc is concerned and neutron-workflow fails with TS2307. It
      # passes locally only because a previous build left dist/ behind — the
      # same shape as the neutron-ts bin symlink that install could not create.
      # This was recorded as "blocked on publishing to npm"; it is not.
      - run: pnpm build
        working-directory: typescript

      - run: pnpm typecheck
        working-directory: typescript
