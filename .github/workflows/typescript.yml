name: TypeScript Framework

on:
  push:
    branches: [main]
    paths:
      - "typescript/**"
      - ".github/workflows/typescript.yml"
  pull_request:
    paths:
      - "typescript/**"
      - ".github/workflows/typescript.yml"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. typescript/package.json declares
      # `packageManager: pnpm@9.15.4` and the lockfile is written by it;
      # `version: latest` silently ran pnpm 11 against it. Let the action read
      # the declared version so there is one source of truth.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: typescript/package.json

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: typescript

      - name: Build
        run: pnpm build
        working-directory: typescript

      - name: Test
        run: pnpm test
        working-directory: typescript

      # Render guards: rebuilds the playground with the docker preset and
      # asserts the SSG golden HTML matches the committed snapshot byte-for-byte
      # (after normalizing build-time timestamps) and the gzipped server bundle
      # stays under budget. Catches drift in the shared render core.
      - name: Render guards (golden HTML + bundle budget)
        run: node scripts/render-guards.mjs
        working-directory: typescript

      # Both of these existed as scripts and neither ran in CI, while
      # docs/react-compat.md claimed the dual-runtime lane was covered. A-007.
      - name: Dual-runtime smoke (preact + react-compat)
        run: pnpm run ci:runtime-compat
        working-directory: typescript

      - name: React ecosystem compatibility matrix
        run: pnpm run ci:compat-matrix
        working-directory: typescript

      # These three were written as CI steps and then never ran: they lived in
      # typescript/.github/workflows/ci.yml, and GitHub only reads workflows
      # from the repository root. The file was syntactically valid, referenced
      # real scripts, and executed zero times. Folded in here so they run.
      - name: Naming conventions
        run: pnpm run ci:naming
        working-directory: typescript

      - name: Workspace graph
        run: pnpm run ci:workspace
        working-directory: typescript

      - name: Data profile smoke (memory)
        run: pnpm run ci:data-profiles
        working-directory: typescript

      # The only coverage of the esbuild dep-optimizer failure class: an app
      # that reaches the runtime by an alias rather than by its registry
      # specifier used to take the dev server down on an unresolvable
      # `virtual:neutron-islands`. Bounded and self-cleaning; fails as a
      # failure, not a cancellation.
      - name: Aliased install smoke (dev server survives aliased installs)
        run: pnpm run ci:aliased-install
        working-directory: typescript

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: typescript/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - run: pnpm install
        working-directory: typescript

      # Build before typechecking. Workspace packages resolve through their
      # published entry points (`types: dist/index.d.ts`), so on a fresh
      # checkout `@neutron-build/ai` and `@neutron-build/nucleus` do not exist
      # as far as tsc is concerned and neutron-workflow fails with TS2307. It
      # passes locally only because a previous build left dist/ behind — the
      # same shape as the neutron-ts bin symlink that install could not create.
      # This was recorded as "blocked on publishing to npm"; it is not.
      - run: pnpm build
        working-directory: typescript

      - run: pnpm typecheck
        working-directory: typescript

  # Browser e2e: the only tests that verify in a real browser that routing,
  # actions, and island hydration actually work end-to-end. Chromium only —
  # the suite checks framework behaviour, not cross-browser rendering, and
  # every extra engine costs a browser download per CI run.
  e2e:
    name: Browser e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: typescript/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - run: pnpm install

      - run: pnpm build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('typescript/pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm --filter @neutron/playground exec playwright install --with-deps chromium

      - name: Run e2e suite
        run: pnpm --filter @neutron/playground run test:e2e
