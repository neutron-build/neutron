name: Repo Hygiene

# Deliberately NOT path-filtered. The thing being checked is "did a file that
# should be private get committed", and the answer depends on every path in the
# tree, not on a subset. Path filters are also what let five workflows sit red
# for months and what kept the doc-metrics check from ever seeing README.md --
# this repo has been bitten by them twice, so this one runs on everything.
#
# The job is a few seconds of Python against `git ls-files`; running it on every
# push costs nothing worth optimising.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ignored-not-tracked:
    name: No tracked file is matched by an ignore rule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check .gitignore intent matches reality
        run: python3 .github/scripts/check_ignored_not_tracked.py

  line-endings:
    name: No file flips its line-ending style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The check compares each modified file against its previous version,
          # so it needs the parent commit as well as the tip.
          fetch-depth: 2
      - name: Check line endings are preserved
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --depth=1 origin "${{ github.base_ref }}"
            python3 .github/scripts/check_line_endings.py --range "origin/${{ github.base_ref }}..HEAD"
          else
            python3 .github/scripts/check_line_endings.py --range "HEAD~1..HEAD"
          fi

      # A documented function that does not exist is the worst documentation
      # bug there is: the reader copies the first example and gets `unknown
      # function`. It has been found by hand three times, months apart — most
      # recently the public Key-Value page opening with `KV_DELETE` (the real
      # name is `KV_DEL`) and documenting four set/TTL functions that are not
      # implemented at all.
      - name: Every documented Nucleus function exists
        run: python3 .github/scripts/check_documented_functions.py

  contract-ir:
    name: The contract IR agrees with the prose contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Lives here rather than in the conformance workflow because that one is
      # path-filtered to the SDK trees, and the thing most likely to break this
      # is an edit to FRAMEWORK_CONTRACT.md itself. Dependency-free and boots no
      # SDK, so it costs a few seconds.
      - name: contract-ir.json matches FRAMEWORK_CONTRACT.md
        run: node conformance/runner/validate-ir.mjs

      # A generator nobody re-runs is a one-off transcription with extra steps.
      # This fails when the IR has moved and the generated surface has not.
      - name: Generated contract surfaces are current
        run: node conformance/generate-app.mjs python --check
