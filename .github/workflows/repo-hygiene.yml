name: Repo Hygiene

# Deliberately NOT path-filtered. The thing being checked is "did a file that
# should be private get committed", and the answer depends on every path in the
# tree, not on a subset. Path filters are also what let five workflows sit red
# for months and what kept the doc-metrics check from ever seeing README.md --
# this repo has been bitten by them twice, so this one runs on everything.
#
# The job is a few seconds of Python against `git ls-files`; running it on every
# push costs nothing worth optimising.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ignored-not-tracked:
    name: No tracked file is matched by an ignore rule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check .gitignore intent matches reality
        run: python3 .github/scripts/check_ignored_not_tracked.py

  line-endings:
    name: No file flips its line-ending style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The check compares each modified file against its previous version,
          # so it needs the parent commit as well as the tip.
          fetch-depth: 2
      - name: Check line endings are preserved
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --depth=1 origin "${{ github.base_ref }}"
            python3 .github/scripts/check_line_endings.py --range "origin/${{ github.base_ref }}..HEAD"
          else
            python3 .github/scripts/check_line_endings.py --range "HEAD~1..HEAD"
          fi
