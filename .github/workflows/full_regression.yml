name: Full Regression Tests

on:
  push:
    branches: [main]
    paths:
      - "nucleus/**"
      - ".github/workflows/full_regression.yml"
  pull_request:
    paths:
      - "nucleus/**"
      - ".github/workflows/full_regression.yml"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: 1

jobs:
  full_regression:
    name: Nucleus Full Regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: nucleus

      - name: Build nucleus
        run: cargo build --features bench-tools
        working-directory: nucleus

      - name: Run all executor tests
        run: cargo test --lib executor -q
        working-directory: nucleus

      - name: Run all wire/transport tests
        run: cargo test --lib -q -- wire transport
        working-directory: nucleus

      - name: Run all storage tests
        run: cargo test --lib storage -q
        working-directory: nucleus

      - name: Run all data model tests
        run: cargo test --lib -q -- kv vector document graph fts geo blob streams columnar datalog pubsub timeseries
        working-directory: nucleus

      - name: Run all integration tests
        run: cargo test --test '*' -q -- --test-threads=1
        working-directory: nucleus

      - name: Compete benchmark (100 iterations, 10k rows)
        run: cargo run --release --features bench-tools --bin compete -- --iterations 100 --rows 10000
        working-directory: nucleus

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compete-results
          path: nucleus/compete_results_*.json

      - name: Block merge if tests failed
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: core.setFailed('Full regression tests failed')

  clippy_full:
    name: Clippy (Full)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: nucleus
      - run: cargo clippy --all-targets --features bench-tools,memory-debug -- -D warnings
        working-directory: nucleus

  fmt_check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --check
        working-directory: nucleus
