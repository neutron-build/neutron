name: Publish neutron-py

on:
  push:
    tags:
      - 'python-v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check release tag and main ancestry
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          package_version=$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("python/pyproject.toml").read_text())["project"]["version"])')
          test "$GITHUB_REF_NAME" = "python-v$package_version"

      - name: Install test and build dependencies
        working-directory: python
        run: python -m pip install -e '.[test]' build twine

      - name: Test Python package
        working-directory: python
        run: python -m pytest -q

      - name: Build and validate distributions
        working-directory: python
        run: |
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: neutron-py-dist
          path: python/dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: neutron-py-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
