name: Publish neutron-framework

on:
  push:
    tags:
      - 'python-v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Check release tag and main ancestry
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          package_version=$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("python/pyproject.toml").read_text())["project"]["version"])')
          test "$GITHUB_REF_NAME" = "python-v$package_version"

      - name: Install test and build dependencies
        working-directory: python
        run: python -m pip install -e '.[test]' build twine

      - name: Test Python package
        working-directory: python
        run: python -m pytest -q

      - name: Build and validate distributions
        working-directory: python
        run: |
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neutron-framework-dist
          path: python/dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: neutron-framework-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
