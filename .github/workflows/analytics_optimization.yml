name: Analytics Optimizations

# `workflow_dispatch` is not optional on a path-filtered workflow. This one went
# red on a commit that touched `executor/mod.rs`, was fixed by the very next
# commit, and then had no way to be re-run — the fix touched only docs, which
# its filter excludes, so it would have sat red on main until something happened
# to edit one of six specific files. That is the same mechanism that hid five
# red workflows for three months (ORCHESTRATION §5a); the check being correct
# does not help if it cannot be re-run on demand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nucleus/src/executor/aggregate.rs"
      - "nucleus/src/executor/mod.rs"
      - "nucleus/src/storage/buffer.rs"
      - "nucleus/src/storage/compression.rs"
      - "nucleus/src/simd/**"
      - "nucleus/benches/phase4_bench.rs"
      - ".github/workflows/analytics_optimization.yml"
  pull_request:
    paths:
      - "nucleus/src/executor/aggregate.rs"
      - "nucleus/src/executor/mod.rs"
      - "nucleus/src/storage/buffer.rs"
      - "nucleus/src/storage/compression.rs"
      - "nucleus/src/simd/**"
      - "nucleus/benches/phase4_bench.rs"
      - ".github/workflows/analytics_optimization.yml"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  analytics_tests:
    name: Analytics Optimization Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: nucleus

      - name: Test zone maps and granule statistics
        run: cargo test --lib -q -- storage::buffer storage::mvcc
        working-directory: nucleus

      - name: Test GROUP BY and aggregations
        run: cargo test --lib executor::aggregate -q
        working-directory: nucleus

      - name: Test lazy materialization
        run: cargo test --lib executor::project -q
        working-directory: nucleus

      - name: Test SIMD infrastructure
        run: cargo test --lib simd -q
        working-directory: nucleus

      - name: Benchmark analytics optimizations
        run: cargo bench --bench phase4_bench -- --verbose
        working-directory: nucleus

      # The benchmark has run on every qualifying push for months and has never
      # been compared against its own past: criterion writes estimates under
      # target/criterion, and the runner is reclaimed with them still on it. So
      # collect them into one file and keep it.
      #
      # This deliberately does NOT gate yet. Arming a wall-clock threshold before
      # measuring the noise is a guess, and on shared runners the noise dominates
      # — arming the TypeScript gate turned up at least two GitHub performance
      # classes, worth 40% on I/O-bound work, and its old 20% threshold would
      # have fired on three of eight green runs. The equivalent number for these
      # benchmarks is simply unknown, because nothing has ever recorded it.
      #
      # Once five or more of these artifacts exist, derive the per-benchmark
      # noise floor and arm from it. typescript/benchmarks/scripts/
      # measure-gate-noise.mjs is the worked example of that method.
      - name: Collect benchmark estimates
        if: always()
        run: sh scripts/collect-bench-estimates.sh bench-estimates.json
        working-directory: nucleus

      - name: Upload benchmark estimates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nucleus-bench-estimates-${{ github.run_id }}
          path: nucleus/bench-estimates.json
          if-no-files-found: warn
          retention-days: 90

  clippy:
    name: Clippy (Analytics)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nucleus
      - run: cargo clippy --lib -- -D warnings
        working-directory: nucleus

  documentation:
    name: Analytics Metrics Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate analytics metrics match source code
        run: sh scripts/metrics.sh --check
        working-directory: nucleus
