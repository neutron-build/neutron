name: Schema Contracts

# Cross-language agreement gate for the schema document contract: the
# TypeScript consumer and the Go validator must produce identical canonical
# bytes and SHA-256 hashes for every golden fixture and reject every invalid
# fixture for the same reason (V09).

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "cli/internal/db/**"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "cli/internal/db/**"
      - ".github/workflows/contracts.yml"

jobs:
  agreement:
    name: TS/Go canonical agreement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Plain node, no install step: the consumer is dependency-free and runs
      # via type stripping (node >= 22.6).
      - name: TypeScript consumer over golden fixtures
        run: node --experimental-strip-types contracts/data/consumer.ts

      # Keep schema-v2.json load-bearing (review F2): it must validate
      # against the draft 2020-12 metaschema, accept every valid golden
      # document, reject the shape-level invalid fixtures, and accept the
      # cross-object invalid fixtures (those are validator-only by design —
      # see the shape/cross-object split table in contracts/data/README.md).
      # ajv is fetched on demand by npx; nothing is added to the repo.
      - name: JSON Schema is load-bearing (ajv, draft 2020-12)
        run: |
          set -e
          npx --yes ajv-cli@5 compile --spec=draft2020 -s contracts/data/schema-v2.json
          npx --yes ajv-cli@5 validate --spec=draft2020 -s contracts/data/schema-v2.json \
            -d "contracts/data/golden/valid/*.json"
          python3 contracts/data/test_check_schema.py
          python3 contracts/data/check_schema.py

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: cli/go.sum

      # Golden fixtures are in contracts/, outside cli/, so point the test at
      # the checked-out tree; only the contract tests run here (no database,
      # no Studio embed needed).
      - name: Go validator over golden fixtures
        run: go test ./internal/db -run 'TestV2|TestDetect|TestValidateSchemaDocument|TestUpgradeV1' -count=1
        working-directory: cli

      - name: Vet
        run: go vet ./internal/db
        working-directory: cli
