name: Nucleus Database Engine

on:
  push:
    branches: [main]
    paths:
      - "nucleus/**"
      - ".github/workflows/nucleus.yml"
  pull_request:
    paths:
      - "nucleus/**"
      - ".github/workflows/nucleus.yml"
  schedule:
    - cron: "0 8 * * 1"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Server library (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: nucleus

      - name: Build
        run: cargo build
        working-directory: nucleus

      # Reports target/ sizes on every run so growth is visible in the log, and
      # fails past a ceiling. Nothing prunes target/; nucleus/target/debug once
      # reached 60 GB and took a machine to zero bytes free. A-017.
      - name: Report cargo target sizes
        run: sh scripts/report-build-size.sh
        working-directory: nucleus

      - name: Test (lib only — skips slow stress tests)
        run: cargo test --lib -q
        working-directory: nucleus

  core:
    name: Embedded core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nucleus
      - name: Test core-only library
        run: cargo test --no-default-features --lib -q
        working-directory: nucleus
      - name: Lint core-only library
        run: cargo clippy --no-default-features --lib -- -D warnings
        working-directory: nucleus

  wasm:
    name: Browser/WASM boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nucleus
      - name: Check WASM without server features
        run: cargo check --no-default-features --features wasm --target wasm32-unknown-unknown
        working-directory: nucleus

  optional-features:
    name: Optional feature (${{ matrix.feature }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: [otel, onnx, memory-debug]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nucleus
      - run: cargo check --features "${{ matrix.feature }}"
        working-directory: nucleus

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nucleus
      - name: Run all non-ignored integration tests serially
        run: cargo test --test '*' -q -- --test-threads=1
        working-directory: nucleus

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nucleus
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: nucleus

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
        working-directory: nucleus

  # The doc-metrics check moved to .github/workflows/doc-metrics.yml: it also
  # validates README.md, llms.txt and the marketing site, which this workflow's
  # `nucleus/**` path filter would never trigger on.

  dependency-policy:
    name: Dependency, license, and unsafe policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nucleus
      - name: Install RustSec audit client
        run: cargo install cargo-audit --locked
      - name: Reject known dependency vulnerabilities
        run: cargo audit
        working-directory: nucleus
      - name: Validate dependency license policy
        run: bash scripts/check-licenses.sh
        working-directory: nucleus
      - name: Enforce reviewed unsafe-code boundary
        run: bash scripts/check-unsafe.sh
        working-directory: nucleus
