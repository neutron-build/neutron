[package]
name = "neutron-live-conformance-rust"
version = "0.0.0"
edition = "2021"
publish = false

# Deliberately NOT a member of the rust/ workspace. This executor exists to test
# the shipped client from the outside; joining the workspace would let it share
# feature unification and dev-dependencies with the crate under test, so a
# feature enabled by some other crate could make a case pass here that fails for
# a real consumer.
[workspace]

[dependencies]
neutron-nucleus = { path = "../../../../rust/crates/neutron-nucleus" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1"] }
uuid = "1"

[[bin]]
name = "run-live"
path = "src/main.rs"
